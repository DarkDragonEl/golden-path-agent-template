# DECISIONS.md DEC-040. App-of-apps root: syncs deploy/argocd/apps/ as a
# plain directory of Application manifests. Scoped to demo-prod only --
# ephemeral-test is pipeline-managed, not GitOps-managed (see
# application-ephemeral-test.yaml); staging/pilot-prod stay un-synced
# per DEC-021's "no staging, no pilot" decision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-agent-root
  namespace: openshift-gitops
spec:
  project: golden-path-agent
  source:
    repoURL: https://github.com/DarkDragonEl/golden-path-agent-template.git
    targetRevision: main
    path: deploy/argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
