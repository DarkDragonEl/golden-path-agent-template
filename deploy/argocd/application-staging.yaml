apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-agent-staging
  namespace: openshift-gitops
spec:
  project: golden-path-agent
  source:
    repoURL: https://github.com/DarkDragonEl/golden-path-agent-template.git
    targetRevision: main
    path: deploy/kustomize/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: golden-path-agent-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
