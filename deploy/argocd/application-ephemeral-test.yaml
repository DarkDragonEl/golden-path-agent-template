# DELIBERATELY NOT part of deploy/argocd/apps/ --
# golden-path-agent-ephemeral-test is pipeline-managed (deploy-ephemeral
# applies an unpromoted digest per PipelineRun), not GitOps-managed; a
# real, dry-run-validated scaffold for a future GitOps-synced path, kept
# out of the app-of-apps root's sync target on purpose.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-agent-ephemeral-test
  namespace: openshift-gitops
spec:
  project: golden-path-agent
  source:
    repoURL: https://github.com/DarkDragonEl/golden-path-agent-template.git
    targetRevision: main
    path: deploy/kustomize/overlays/ephemeral-test
  destination:
    server: https://kubernetes.default.svc
    namespace: golden-path-agent-ephemeral-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
