# Phase F4 (DECISIONS.md DEC-087/DEC-092). Auto-sync on, matching
# demo-prod's own precedent (this repo's commit is the human gate, same
# as demo-prod's promotion-PR-merge reasoning) -- no separate promotion
# step exists for RHDH, so there is no other gate to defer to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-agent-rhdh
  namespace: openshift-gitops
spec:
  project: golden-path-agent
  source:
    repoURL: https://github.com/DarkDragonEl/golden-path-agent-template.git
    targetRevision: main
    path: deploy/kustomize/overlays/rhdh
  destination:
    server: https://kubernetes.default.svc
    namespace: golden-path-agent-rhdh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # namespace is bootstrapped once, out-of-band
        # (pipelines/bootstrap/namespaces.yaml), same reasoning as
        # demo-prod's own Application.
