# ADR-011. Platform Foundation singleton's own Application
# (mirrors rhdh.yaml) -- auto-sync on, since no separate promotion step
# exists for it; this repo's own commit is the human gate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-agent-approval
  namespace: openshift-gitops
spec:
  project: golden-path-agent
  source:
    repoURL: https://github.com/DarkDragonEl/golden-path-agent-template.git
    targetRevision: main
    path: deploy/kustomize/overlays/approval-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: golden-path-agent-approval
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # namespace is bootstrapped once, out-of-band
        # (pipelines/bootstrap/namespaces.yaml), same reasoning as
        # demo-prod's/RHDH's own Applications.
