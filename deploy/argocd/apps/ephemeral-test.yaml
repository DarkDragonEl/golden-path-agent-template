# Phase C, Step C4 (DECISIONS.md DEC-021). Moved here from
# deploy/argocd/application-ephemeral-test.yaml unchanged -- this
# directory is what the root app-of-apps Application
# (deploy/argocd/application-root.yaml) actually syncs; content identical
# to before the move, only the file's location changed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-agent-ephemeral-test
  namespace: openshift-gitops
spec:
  project: golden-path-agent
  source:
    repoURL: https://github.com/DarkDragonEl/golden-path-agent-template.git
    targetRevision: main
    path: deploy/kustomize/overlays/ephemeral-test
  destination:
    server: https://kubernetes.default.svc
    namespace: golden-path-agent-ephemeral-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
