# Auto-sync deliberately ON (unlike pilot-prod's
# stub) -- the promotion-PR merge is this environment's own human gate;
# once merged, ArgoCD picks up the promoted digest with no manual apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-agent-demo-prod
  namespace: openshift-gitops
spec:
  project: golden-path-agent
  source:
    repoURL: https://github.com/DarkDragonEl/golden-path-agent-template.git
    targetRevision: main
    path: deploy/kustomize/overlays/demo-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: golden-path-agent-demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # namespace is bootstrapped once, out-of-band
        # (pipelines/bootstrap/namespaces.yaml) -- same reasoning as
        # pilot-prod's existing stub, not ArgoCD-managed.
