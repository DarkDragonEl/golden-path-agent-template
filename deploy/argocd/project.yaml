# Single small AppProject scoped to this one repo and its four destination
# namespaces (three environment namespaces plus the shared GitOps
# controller's own namespace, for this project's own Application objects
# only -- see the openshift-gitops destination entry below) — not a
# multi-service, multi-repo platform project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: golden-path-agent
  namespace: openshift-gitops # ADR-018: shared GitOps controller --
  # this AppProject is the only object this project touches in it.
spec:
  description: Golden-path agent MVP — one repo, four promoted environments.
  sourceRepos:
    - https://github.com/DarkDragonEl/golden-path-agent-template.git
    # ADR-018: public repo, HTTPS -- the shared GitOps controller needs no
    # read credential, avoiding a blast-radius increase to its own
    # repo-credentials Secret.
  destinations:
    - namespace: golden-path-agent-ephemeral-test
      server: https://kubernetes.default.svc
    - namespace: golden-path-agent-demo-prod
      server: https://kubernetes.default.svc
    - namespace: golden-path-agent-staging
      server: https://kubernetes.default.svc
    - namespace: golden-path-agent-pilot-prod
      server: https://kubernetes.default.svc
    - namespace: golden-path-agent-rhdh
      server: https://kubernetes.default.svc
      # RHDH's own dedicated Postgres + Backstage CR -- additive
      # pattern, nothing narrowed from what already exists.
    - namespace: golden-path-agent-approval
      server: https://kubernetes.default.svc
      # ADR-011: approval service's own Platform Foundation home,
      # extracted out of golden-path-agent-demo-prod.
    - namespace: openshift-gitops
      server: https://kubernetes.default.svc
      # Required for the root app-of-apps Application to manage
      # this project's own child Applications (deploy/argocd/apps/*.yaml).
      #
      # ArgoCD does NOT structurally enforce that an Application
      # created here shares this AppProject's own spec.project value --
      # Applications in the control-plane namespace may set spec.project
      # to any AppProject (a documented backwards-compatibility exemption).
      # The real protection is sourceRepos scoping above plus this repo's
      # own commit discipline (every committed child manifest declares
      # spec.project: golden-path-agent).
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: policy
      kind: PodDisruptionBudget
    - group: ""
      kind: PersistentVolumeClaim # approval service's SQLite
      # persistence (pvc-approval.yaml, SRS-APR-DATA-01).
    - group: ""
      kind: Secret # ADR-018: plain Secret, not ExternalSecret (ESO
      # deferred as a phase-two integration point).
    - group: argoproj.io
      kind: Application # app-of-apps pattern -- required for
      # the root Application to manage the child Applications; still
      # bounded by this same AppProject's destinations/whitelist.
    - group: rhdh.redhat.com
      kind: Backstage # RHDH Operator's own namespace-scoped CR
      # (deploy/kustomize/overlays/rhdh/backstage.yaml).
