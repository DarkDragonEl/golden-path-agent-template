apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-path-agent-pilot-prod
  namespace: REPLACE_WITH_GITOPS_NAMESPACE # TODO(platform)
spec:
  project: golden-path-agent
  source:
    repoURL: REPLACE_WITH_GIT_REPO_URL # TODO(platform)
    targetRevision: main
    path: deploy/kustomize/overlays/pilot-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: golden-path-agent-pilot-prod
  syncPolicy:
    automated: null # manual sync = the deployment-promotion gate for pilot-prod
    syncOptions:
      - CreateNamespace=false # pilot-prod namespace is provisioned deliberately, not auto-created
