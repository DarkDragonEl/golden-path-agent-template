# DEC-020: local-dev OTel Collector, minimal by design -- an OTLP HTTP
# receiver and a debug exporter to this container's own stdout
# (`podman logs golden-path-otel-collector-dev`). No trace-visualization
# UI at this phase.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
