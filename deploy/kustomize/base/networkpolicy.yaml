# The MCP server's independent security boundary: only the agent pod may
# reach it, even though both roles ship from the same image.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: golden-path-agent-mcp-restrict
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent
      app.kubernetes.io/component: mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golden-path-agent
              app.kubernetes.io/component: agent
        # ADR-011 (addendum): operational-tests.yaml's kill-primary-
        # fallback clone. Narrow second entry, not a widened first --
        # `agent-fallback-demo` deliberately isn't a subset-match for the
        # standing agent Deployment's selector (avoids ReplicaSet
        # adoption).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: golden-path-agent
              app.kubernetes.io/component: agent-fallback-demo
      ports:
        - port: 8081
          protocol: TCP
