apiVersion: v1
kind: Service
metadata:
  name: golden-path-agent
  labels:
    backstage.io/kubernetes-id: golden-path-agent # DEC-141: Topology resolves
    # Route -> Service -> workload, so the Service must be selected too.
spec:
  selector:
    app.kubernetes.io/name: golden-path-agent
    app.kubernetes.io/component: agent
  ports:
    - name: http
      port: 8080
      targetPort: http
