apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DECISIONS.md DEC-031: externalsecret.yaml (an ExternalSecret stub) is no
# longer a managed resource here -- the Phase C plan's secret-handling
# decision (DEC-024) uses a plain Secret, manually provisioned out-of-band
# (docs/phase-c-runbook.md §2), never applied by Kustomize/the pipeline.
# A stub Secret object here (unlike the old ExternalSecret, which only
# ever *referenced* material, never contained it) would risk `oc apply`
# overwriting the real, manually-created secret's data with placeholder
# content -- the safe fix is not declaring it as a managed resource at
# all. deployment-agent.yaml's envFrom.secretRef still references
# golden-path-agent-secrets by name; nothing here needs to create it.
resources:
  - deployment-agent.yaml
  - deployment-mcp.yaml
  - service-agent.yaml
  - service-mcp.yaml
  - ingress.yaml
  - serviceaccount.yaml
  - serviceaccount-mcp.yaml
  - configmap.yaml
  - networkpolicy.yaml
  - pdb.yaml
  # Phase D2 cutover (DECISIONS.md DEC-063): the approval-service
  # manifests, promoted from the ephemeral-test-only nested kustomization
  # (deploy/kustomize/base/approval/, DEC-050) into base/ directly, per
  # DEC-046's own sequencing rule -- this is the one commit that also
  # flips AUTH_MODE=oidc (demo-prod overlay) and adds the mechanical
  # demo-prod assertion, all together, atomically. Flattened rather than
  # kept as a nested kustomization: DEC-050's whole reason for the
  # nesting was working around kustomize's file-reference restriction
  # from ephemeral-test's overlay -- base/kustomization.yaml is these
  # files' own directory, so no such restriction applies here, and
  # flattening also means deployment-approval.yaml is now visible to
  # this file's own images: transform below, retiring DEC-050's separate
  # base/approval/kustomization.yaml images: stanza entirely.
  - serviceaccount-approval.yaml
  - configmap-approval.yaml
  - pvc-approval.yaml
  - deployment-approval.yaml
  - service-approval.yaml
  - networkpolicy-approval.yaml
  - ingress-approval.yaml
  - pdb-approval.yaml

commonLabels:
  app.kubernetes.io/name: golden-path-agent
  app.kubernetes.io/part-of: golden-path-agent

# CI/CD promotion updates only the matching entry's digest field — each
# of the three components below is now an independently built, promoted,
# and digest-pinned artifact (DEC-098/DEC-099, G2 three-image split),
# superseding the prior single shared-image design. `newName` resolved
# to the real value at Step C4 (DECISIONS.md DEC-042) -- not a
# placeholder needing anonymization: this is OpenShift's own standard,
# predictable internal registry service DNS name (present on every
# OpenShift cluster) plus this project's own namespace, already public
# throughout this repo's committed RBAC/pipeline manifests. Unlike the
# model endpoint (a real external hostname, never committed), this value
# discloses nothing beyond what's already committed elsewhere.
# `ephemeral-test`'s own pipeline-injected digest overrides these
# `newName`s too via `kustomize edit set image` (DEC-031, extended by G2
# to update only the one entry under test per run) -- unaffected by this
# change, since it always fully replaces both fields at apply-time for
# whichever image name it targets. open-promotion-pr.yaml's promotion
# edit is now range-scoped per image name (G2) so promoting one
# component never touches the other two's committed digest here.
images:
  # One-time manual bootstrap (G2 post-merge, real gap found live): the
  # placeholder digest above pre-dates the split and only ever existed in
  # the old shared golden-path-agent repo. golden-path-agent-mcp and
  # golden-path-agent-approval are NEW repo paths introduced by this same
  # split -- nothing had ever been pushed to them, so their first
  # deploy-ephemeral runs (golden-path-agent-ci-mcp-b8jkz,
  # golden-path-agent-ci-approval-tdrgw) correctly ImagePullBackOff'd on
  # it. Each component's own pipeline cannot self-promote past this,
  # since deploy-ephemeral always renders and rolls out all three
  # Deployments together and fails before open-promotion-pr ever runs.
  # Digests below are real, captured live from each pipeline's own
  # digest-capture Task against the same merged commit (05e16ae), not
  # invented -- this is the one-time exception to the normal
  # pipeline-gated promotion path, needed only because the repo names
  # themselves are new.
  - name: golden-path-agent
    newName: image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent
    digest: sha256:70563b839b3aebe8cad25a8544a544e063bbae9ad376fbb542c75a5c9061d1cd
  - name: golden-path-agent-mcp
    newName: image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent-mcp
    digest: sha256:8591c0424a85bb27321745d3f023bd768c7bde525270b6b0faa9de72a2ac1b9d
  - name: golden-path-agent-approval
    newName: image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent-approval
    digest: sha256:a3244d67e0e659c45c04d89c88f505b90c3f858c34d4c8503f547b70d3361657
