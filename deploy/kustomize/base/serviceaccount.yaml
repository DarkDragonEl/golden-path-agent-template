# ADR-025: the agent's own identity anchor -- serviceaccount-mcp.yaml
# is the mcp role's own, separate ServiceAccount (fixes the
# shared-identity finding).
#
# DEFERRED: SA-token OIDC federation is real, unbudgeted extra
# complexity for this scope; client-credentials (agent/oidc_client.py)
# was chosen instead -- not a stale intention left by accident.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-path-agent
  annotations: {}
