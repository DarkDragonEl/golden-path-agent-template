apiVersion: v1
kind: Service
metadata:
  name: golden-path-agent-mcp
  labels:
    backstage.io/kubernetes-id: golden-path-agent # DEC-141: Topology resolves
    # Route -> Service -> workload, so the Service must be selected too.
spec:
