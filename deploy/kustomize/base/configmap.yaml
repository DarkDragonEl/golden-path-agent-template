# This is the concrete "environment differences expressed through
# configuration" artifact the proposal calls for. Every value here is a
# safe local-dev-shaped default; overlays override per environment via
# configMapGenerator (behavior: merge) — see deploy/kustomize/overlays/*/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-config
data:
  MODEL_API_BASE_URL: "http://localhost:11434/v1"
  MODEL_NAME: "placeholder-model"
  MODEL_FALLBACK_API_BASE_URL: "http://localhost:11434/v1"
  MODEL_FALLBACK_NAME: "placeholder-fallback-model"
  AGENT_MODEL_MODE: "live"
  MCP_TOOL_ENDPOINT: "http://golden-path-agent-mcp:8081"
  MCP_MODE: "mock"
  APPROVAL_SERVICE_ENDPOINT: "http://golden-path-agent-approval:8082" #
  # mirrors MCP_TOOL_ENDPOINT's Service-DNS convention -- agent/config.py's
  # own localhost default is local-dev-only, wrong for any deployed pod.
  AGENT_OIDC_MODE: "none" # none | oidc, declared explicitly
  # matching MCP_MODE/AUTH_MODE(approval)'s own convention.
  OIDC_ISSUER_URL: "http://golden-path-agent-service.golden-path-agent-keycloak.svc.cluster.local:8080/realms/golden-path-agent" #
  # internal Service DNS -- not a secret, one realm for all envs.
  APPROVAL_OIDC_CLIENT_ID: "golden-path-agent-approval-workload" # not
  # secret, identical everywhere -- the realm's own client id.
  MCP_OIDC_CLIENT_ID: "golden-path-agent-mcp-workload" # same reasoning.
  APPROVAL_OIDC_CLIENT_SECRET: "not-needed" # safe placeholder --
  # demo-prod's real value comes from golden-path-agent-secrets instead
  # (KNOWN_SECRET_SHADOWED), never committed here.
  MCP_AUTH_TOKEN: "not-needed" # same shadowing mechanism as
  # APPROVAL_OIDC_CLIENT_SECRET; declared here so the config-contract
  # completeness check (ADR-019) sees it everywhere.
  MCP_AUTH_MODE: "none" # none | oidc, gates mcp_server's
  # POST /tools/{tool_name} auth check -- read via os.environ there, but
  # declared here since deployment-mcp.yaml shares this ConfigMap.
  POLICY_BUNDLE_REF: "policy/baseline_policy.yaml"
  DATA_SOURCE_BINDING: "none"
  MODEL_TEMPERATURE: "0"
  MODEL_SEED: "42"
  MAX_REASONING_STEPS: "5"
  TOOL_TIMEOUT_SECONDS: "10"
  TOOL_RETRY_LIMIT: "2"
  APPROVAL_MODE: "required"
  AUTO_APPROVE_IN_DEV: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: "golden-path-agent"
