  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE   # TODO(platform)
    kind: SecretStore
  target:
    name: golden-path-agent-secrets
  data:
    - secretKey: MODEL_API_KEY
      remoteRef:
        key: REPLACE_WITH_REMOTE_KEY   # TODO(platform)
    - secretKey: MCP_AUTH_TOKEN
      remoteRef:
        key: REPLACE_WITH_REMOTE_KEY   # TODO(platform)
