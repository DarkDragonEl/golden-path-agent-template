apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# DECISIONS.md DEC-050. A separate, nested kustomization root -- NOT
# listed in ../kustomization.yaml's own `resources:` (per DEC-046's
# sequencing decision: demo-prod's Application syncs ../ directly with
# selfHeal: true, and these eight manifests are not production-ready
# during D1 -- AUTH_MODE=none here, no OIDC secret provisioned). Confirmed
# live (local `kustomize build ../` via podman): with this file absent
# from that resources: list, `kustomize build ../` renders zero approval
# resources -- demo-prod genuinely never sees this directory.
#
# Referenced instead from overlays/ephemeral-test/kustomization.yaml as
# `../../base/approval`, a sibling kustomization root next to `../../base`
# itself. This nesting exists only because kustomize's own security
# restrictor rejects a bare file reference (e.g.
# `../../base/deployment-approval.yaml`) that isn't in or below the
# referencing kustomization's own directory tree -- confirmed live via
# podman + the pipeline's own `registry.k8s.io/kustomize/kustomize:v5.8.1`
# image: "file ... is not in or below ...". A kustomization-ROOT
# reference (a directory containing its own kustomization.yaml, exactly
# like `../../base` is already referenced) has no such restriction, so
# this directory exists specifically to make these eight files
# individually reachable that way, without duplicating their content.
resources:
  - serviceaccount-approval.yaml
  - configmap-approval.yaml
  - pvc-approval.yaml
  - deployment-approval.yaml
  - service-approval.yaml
  - networkpolicy-approval.yaml
  - ingress-approval.yaml
  - pdb-approval.yaml

commonLabels:
  app.kubernetes.io/name: golden-path-agent
  app.kubernetes.io/part-of: golden-path-agent

# Mirrors ../kustomization.yaml's own images stanza exactly, including
# its comment's own reasoning -- this file needs its OWN copy because
# deployment-approval.yaml is invisible to ../kustomization.yaml's
# transform (it is never in that file's own resources: list). Confirmed
# live: the pipeline's per-deployment digest override (deploy-ephemeral's
# `kustomize edit set image`) must therefore run against THIS file too,
# not just ../kustomization.yaml -- one `kustomize edit set image` call
# per kustomization that actually owns a Deployment referencing this
# image, matching the project's own established convention of editing
# the owning kustomization directly rather than the overlay (the same
# reason ../../overlays/ephemeral-test/kustomization.yaml is never edited
# for this purpose, per that Task's own comment).
images:
  - name: golden-path-agent
    newName: image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent
    digest: sha256:d73ce33214c64fdfa19388ebbd111d1e8c24e0e17996e31b4b0df57549a242ac
