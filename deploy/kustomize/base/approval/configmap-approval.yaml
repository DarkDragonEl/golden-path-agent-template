# Dedicated ConfigMap, not folded into golden-path-agent-config -- the
# approval service's own config surface (DB path, timeout, OIDC
# issuer/audience/role-claim, AUTH_MODE) barely overlaps the agent/MCP
# config; a shared ConfigMap with keys most components ignore gets
# confusing fast. Mirrors the per-overlay configMapGenerator pattern
# already used elsewhere in this repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-approval-config
data:
  APPROVAL_DB_PATH: "./state/approval/approvals.db"
  APPROVAL_TIMEOUT_SECONDS: "3600"
  AUTH_MODE: "none"   # DEC-045: owner-binding requirement -- demo-prod's
  # rendered config must assert AUTH_MODE=oidc once D2 lands, checked
  # mechanically (tools/check_config_contract.py or an equivalent
  # manifest check), never left to convention.
  APPROVER_ROLE_CLAIM: "roles"
  APPROVER_ROLE_VALUE: "approval-approver"
