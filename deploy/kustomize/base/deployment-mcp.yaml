apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-path-agent-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-path-agent
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: golden-path-agent
      containers:
        - name: mcp
          image: golden-path-agent
          args: ["mcp"]
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: golden-path-agent-config
          # FastMCP's streamable-HTTP transport speaks the MCP protocol on
          # this port, not a plain REST /healthz route — probe the socket
          # rather than assuming an HTTP path that doesn't exist here.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
