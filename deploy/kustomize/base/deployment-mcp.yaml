apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-path-agent-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-path-agent
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: golden-path-agent-mcp
      containers:
        - name: mcp
          # (G2): own independently-built/promoted image,
          # not a role of the shared golden-path-agent image anymore --
          # single-purpose, no positional-arg dispatch.
          image: golden-path-agent-mcp
          ports:
            - name: http
              containerPort: 8081
          # Deliberate exception to sharing golden-path-agent-config
          # wholesale below: a container-level env entry takes precedence
          # over the same key sourced via envFrom, so mcp reports its own
          # OTEL_SERVICE_NAME instead of inheriting the agent's
          # ("golden-path-agent") -- otherwise mcp spans are indistinguishable
          # from agent spans by service name once traces flow.
          env:
            - name: OTEL_SERVICE_NAME
              value: golden-path-agent-mcp
          envFrom:
            - configMapRef:
                name: golden-path-agent-config
          # FastMCP's streamable-HTTP transport speaks the MCP protocol on
          # this port, not a plain REST /healthz route — probe the socket
          # rather than assuming an HTTP path that doesn't exist here.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
