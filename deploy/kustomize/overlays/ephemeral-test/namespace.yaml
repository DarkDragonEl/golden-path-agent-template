# DEC-024: bootstrapped once, manually, and stays standing -- creating/
# deleting a Namespace is cluster-scoped, and the pipeline ServiceAccount
# deliberately has no ClusterRoleBinding ever. "Ephemeral" means the
# resources inside (cycled by deploy/destroy-ephemeral), not the
# Namespace object itself. No lifecycle/* annotation: this file is
# re-applied every PipelineRun, so a static value here would self-stomp.
apiVersion: v1
kind: Namespace
metadata:
  name: golden-path-agent-ephemeral-test
