apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: golden-path-agent-ephemeral-test

# ADR-018: namespace.yaml is intentionally not a managed
# resource here -- bootstrapped once out-of-band, no cluster-scoped RBAC
# to manage Namespace objects. Confirmed live: including it hit "cannot
# get/delete resource namespaces" on every deploy/destroy-ephemeral run.
resources:
  - ../../base
  # ADR-008: approval-service manifests are part of ../../base's own
  # resources: directly (nested kustomization retired). Stays
  # AUTH_MODE=none here, per the owner's own D2 execution instruction.

configMapGenerator:
  - name: golden-path-agent-config
    behavior: merge
    literals:
      - MODEL_API_BASE_URL=http://dev-model-endpoint.example.com/v1 # TODO(platform): real dev model endpoint
      - MODEL_NAME=placeholder-model # declared here so
        # `kustomize edit set configmap` has an existing literal to
        # override at apply-time -- it can't add a new key.
      - MODEL_FALLBACK_API_BASE_URL=http://dev-model-endpoint.example.com/v1 # TODO(platform): real fallback model endpoint
      - MODEL_FALLBACK_NAME=placeholder-fallback-model # same
        # pre-existing-literal requirement as MODEL_NAME above --
        # SysR-P-F-12's "one model route + one fallback" is a hard
        # scope requirement.
      - DATA_SOURCE_BINDING=synthetic
      - APPROVAL_MODE=required
      # ADR-011: flipped to "live" -- Containerfile.agent excludes
      # mcp_server/server.py, so MCP_MODE=mock's in-process fallback
      # would ImportError. Also closes a gap: mock mode meant
      # these gates never proved agent<->MCP pods talk over network.
      - MCP_MODE=live
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://golden-path-agent-otel-collector.golden-path-agent-otel.svc.cluster.local:4318 # ADR-006:
        # cluster-tier collector (ADR-020), reachable cross-namespace.
  - name: golden-path-agent-approval-config
    behavior: merge
    literals:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://golden-path-agent-otel-collector.golden-path-agent-otel.svc.cluster.local:4318 # ADR-006

replicas:
  - name: golden-path-agent
    count: 1
