apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Same shared/single-node profile as ../constrained-node/, applied to
# the Platform Foundation's own shared approval-service singleton
# (ADR-012). See that overlay's own header comment for the reasoning;
# base/ (and approval-platform/ itself) are unchanged.
resources:
  - ../approval-platform

patches:
  - target:
      kind: Deployment
      name: golden-path-agent-approval
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
