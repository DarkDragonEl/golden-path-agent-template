# Phase F4 (DECISIONS.md DEC-087/DEC-092). Registers F1's own
# catalog-info.yaml (repo root, DEC-087) into RHDH's live catalog --
# without this, F1's Component sits committed but never actually
# ingested. A public GitHub raw URL, same anonymity posture already
# established for every other reference to this repo's own public slug
# throughout this project (DEC-082's sweep already covers it).
#
# Separate ConfigMap from golden-path-agent-rhdh-oidc-config -- one data
# entry per ConfigMap (the operator's own documented constraint),
# referenced as a second entry in the Backstage CR's own
# appConfig.configMaps list, not merged into the OIDC one.
#
# Real gap found live (F4, DEC-092): the location registered and
# processed fine (confirmed via pod-network curl to the same URL
# succeeding, and the location entity itself being created), but every
# read attempt failed with "NotAllowedError: Reading from '...' is not
# allowed. You may need to configure an integration for the target host,
# or add it to the configured list of allowed hosts at
# 'backend.reading.allow'" -- this is Backstage's own UrlReader security
# guard, unrelated to network reachability or DNS, and it rejects any
# host not explicitly allow-listed regardless of the URL being public.
# backend.reading.allow merges with the oidc ConfigMap's own backend.*
# keys (baseUrl, cors.origin) -- confirmed live, Backstage's config
# merge is per-key-path, not whole-object-replace, so both survive in
# the same running config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-rhdh-catalog-config
  labels:
    app.kubernetes.io/part-of: golden-path-agent
#
# Phase F5 (DEC-087 item 1): a second location entry registers
# template.yaml (repo root) alongside F1's own Component -- a distinct
# entity kind (Template, not Component) from a distinct file, kept as
# its own locations entry rather than merged into catalog-info.yaml's
# own content.
#
# Real gap found live (F5): backend.reading.allow (above) is enough for
# a generic exact-URL fetch, but fetch:template's own *relative* URL
# resolution (this Template's own `url: ./skeleton` step, resolved
# against the Template entity's own GitHub-hosted location) needs a
# matching integrations.github entry -- without it, the scaffolder task
# fails outright with "InputError: No integration found for location
# ...", confirmed by actually running the Template (not assumed).
# No token: this is a public repo and only unauthenticated reads are
# needed here; GitHub's own unauthenticated API rate limit is more than
# sufficient for this sandbox's own render volume.
#
# Phase G, Stage 1 (DEC-098/DEC-099/DEC-100). Third location entry:
# the same Template, additionally registered from the internal Gitea
# mirror (golden-path-agent-admin/golden-path-agent-template, stood up
# in G1) -- proves the Platform Foundation's own Git hosting can serve
# as a template source, ahead of any future decision to make it primary.
# GitHub-hosted locations above are untouched; this is additive, not a
# replacement.
#
# First attempt at this (this same G1 session) tried mimicking Gitea via
# a second `integrations.github` entry with an explicit `apiBaseUrl` --
# wrong integration key entirely. Backstage has a genuine, first-class
# Gitea integration in `@backstage/integration` core (`GiteaIntegration`,
# not a dynamic plugin -- so the missing scaffolder-backend-module-gitea
# dynamic plugin this session found live in `dynamic-plugins-root` is
# irrelevant here). Confirmed by reading `packages/integration/src/
# gitea/core.ts`'s own `parseGiteaUrl` before writing this: it expects
# exactly `https://<host>/<owner>/<repo>/src/branch/<ref>/<path>` --
# which is the same URL shape this session's own live probe already
# used, so that guess was right; only the integration key (`github`
# instead of `gitea`) was wrong. Same two-gate pattern F5 already
# documented for GitHub applies here too: `integrations.gitea` for
# fetch:template's relative-URL resolution, `backend.reading.allow` for
# the catalog's own generic UrlReader guard -- both needed, neither
# alone is sufficient (confirmed by F5's own history, not re-derived).
# No `password` (token) field: this Gitea repo is public and only
# unauthenticated reads are needed for template *loading* -- same
# posture as the GitHub entries above. Add one (referencing a Secret,
# never a literal value here) only if a live read genuinely fails auth.
#
# Phase G, Stage 2 (DEC-098/DEC-099, G5 registration). Three more
# location entries: G5's own locally-designed platform catalog model
# (`platform/catalog/{system,approval-service,model-routes}.yaml`),
# committed but never registered live until now -- same
# `raw.githubusercontent.com` host already allow-listed above, no new
# `backend.reading.allow`/`integrations` entry needed. Deliberately NOT
# registered here: `skeleton/catalog-info.yaml` and `skeleton-tools/
# catalog-info.yaml` -- those are template *output* (rendered into a
# scaffolded project's own repo, `${{ values.x }}` placeholders and all),
# not something to register from this repo's own source tree; they prove
# out for real only once G6's publish flow actually scaffolds and pushes
# a real instance.
#
# Phase G, Stage 3 (DEC-098/DEC-099/DEC-110/DEC-118, G6 Path A landing).
# `username`/`password` added to the `gitea` integration -- read-only use
# (above) needed neither; the real `template.yaml`'s new `publish:gitea`
# step needs write access, and `getGiteaRequestOptions` (`@backstage/
# integration`, read directly at DEC-118's pinned ref before assuming
# this) authenticates exactly this way: `password` is Gitea's own
# convention for "API token here," not a literal password. Values
# substituted via Backstage's own ${VAR} syntax from
# golden-path-agent-rhdh-gitea-scaffolder-secret (provision-identity-
# secrets.sh) -- never a literal in this ConfigMap, same pattern as the
# OIDC secret's own fields. This is the exact `golden-path-agent-
# scaffolder` machine-account token G1 already proved live to actual
# destruction (DEC-100) -- not a new credential.
data:
  app-config.catalog.yaml: |
    backend:
      reading:
        allow:
          - host: raw.githubusercontent.com
          - host: golden-path-agent-gitea-golden-path-agent-gitea.apps.cluster-hj7xp.dyn.redhatworkshops.io
    integrations:
      github:
        - host: github.com
      gitea:
        - host: golden-path-agent-gitea-golden-path-agent-gitea.apps.cluster-hj7xp.dyn.redhatworkshops.io
          username: ${GITEA_SCAFFOLDER_USERNAME}
          password: ${GITEA_SCAFFOLDER_TOKEN}
    catalog:
      locations:
        # Phase H3b (DEC-114 onward, DEC-121 follow-up). Real gap found
        # live via a real browser TechDocs check (the exact class of
        # check DEC-094/DEC-097 already established a scripted call
        # can't substitute for -- third confirmation of that lesson):
        # "FetchUrlReader does not implement readTree". Root cause read
        # directly from this pod's own GithubUrlReader.cjs.js: its
        # predicate is `url.host === integration.config.host`, exact
        # string equality -- registering this Component from
        # raw.githubusercontent.com (below, since F1/DEC-087) never
        # matches the `github.com` integration.github entry already
        # configured, so techdocs-ref: dir:.'s derived URL fell through
        # to the generic FetchUrlReader, which has no readTree at all.
        # This is the identical bug class F5 already found and fixed for
        # fetch:template's own relative-URL resolution (this file's own
        # comment above) -- same fix applies: register via a
        # github.com/blob/main URL, which GithubUrlReader's predicate
        # does match, instead of raw.githubusercontent.com. No new
        # integration, no new Secret -- reuses the same no-token
        # `integrations.github` entry fetch:template already proved
        # works unauthenticated against this public repo.
        - type: url
          target: https://github.com/DarkDragonEl/golden-path-agent-template/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/DarkDragonEl/golden-path-agent-template/blob/main/template.yaml
        - type: url
          target: https://golden-path-agent-gitea-golden-path-agent-gitea.apps.cluster-hj7xp.dyn.redhatworkshops.io/golden-path-agent-admin/golden-path-agent-template/src/branch/main/template.yaml
        # Phase H3b follow-up (DEC-122's raw-URL sweep): pre-emptively
        # switched these three from raw.githubusercontent.com to the
        # github.com/blob/main shape, matching the catalog-info.yaml/
        # template.yaml fix above -- none of these three carried a
        # techdocs-ref annotation at the time of this sweep, so the bug
        # was dormant, not live, but it's the identical landmine one
        # techdocs-ref line away from reproducing DEC-122 verbatim. Fixed
        # now rather than left for whoever adds that annotation next.
        - type: url
          target: https://github.com/DarkDragonEl/golden-path-agent-template/blob/main/platform/catalog/system.yaml
        - type: url
          target: https://github.com/DarkDragonEl/golden-path-agent-template/blob/main/platform/catalog/approval-service.yaml
        - type: url
          target: https://github.com/DarkDragonEl/golden-path-agent-template/blob/main/platform/catalog/model-routes.yaml
