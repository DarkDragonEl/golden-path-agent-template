# Phase F4 (DECISIONS.md DEC-087/DEC-092). Registers F1's own
# catalog-info.yaml (repo root, DEC-087) into RHDH's live catalog --
# without this, F1's Component sits committed but never actually
# ingested. A public GitHub raw URL, same anonymity posture already
# established for every other reference to this repo's own public slug
# throughout this project (DEC-082's sweep already covers it).
#
# Separate ConfigMap from golden-path-agent-rhdh-oidc-config -- one data
# entry per ConfigMap (the operator's own documented constraint),
# referenced as a second entry in the Backstage CR's own
# appConfig.configMaps list, not merged into the OIDC one.
#
# Real gap found live (F4, DEC-092): the location registered and
# processed fine (confirmed via pod-network curl to the same URL
# succeeding, and the location entity itself being created), but every
# read attempt failed with "NotAllowedError: Reading from '...' is not
# allowed. You may need to configure an integration for the target host,
# or add it to the configured list of allowed hosts at
# 'backend.reading.allow'" -- this is Backstage's own UrlReader security
# guard, unrelated to network reachability or DNS, and it rejects any
# host not explicitly allow-listed regardless of the URL being public.
# backend.reading.allow merges with the oidc ConfigMap's own backend.*
# keys (baseUrl, cors.origin) -- confirmed live, Backstage's config
# merge is per-key-path, not whole-object-replace, so both survive in
# the same running config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-rhdh-catalog-config
  labels:
    app.kubernetes.io/part-of: golden-path-agent
#
# Phase F5 (DEC-087 item 1): a second location entry registers
# template.yaml (repo root) alongside F1's own Component -- a distinct
# entity kind (Template, not Component) from a distinct file, kept as
# its own locations entry rather than merged into catalog-info.yaml's
# own content.
#
# Real gap found live (F5): backend.reading.allow (above) is enough for
# a generic exact-URL fetch, but fetch:template's own *relative* URL
# resolution (this Template's own `url: ./skeleton` step, resolved
# against the Template entity's own GitHub-hosted location) needs a
# matching integrations.github entry -- without it, the scaffolder task
# fails outright with "InputError: No integration found for location
# ...", confirmed by actually running the Template (not assumed).
# No token: this is a public repo and only unauthenticated reads are
# needed here; GitHub's own unauthenticated API rate limit is more than
# sufficient for this sandbox's own render volume.
data:
  app-config.catalog.yaml: |
    backend:
      reading:
        allow:
          - host: raw.githubusercontent.com
    integrations:
      github:
        - host: github.com
    catalog:
      locations:
        - type: url
          target: https://raw.githubusercontent.com/DarkDragonEl/golden-path-agent-template/main/catalog-info.yaml
        - type: url
          target: https://github.com/DarkDragonEl/golden-path-agent-template/blob/main/template.yaml
