# DEC-087: RHDH's own dedicated Postgres, separate from Keycloak's own
# DB, same plain Deployment+PVC pattern (no new operator). GitOps-managed
# (unlike Keycloak's manual bootstrap), since RHDH's Backstage CR is
# GitOps-managed too. Credentials: a plain Secret
# (golden-path-agent-rhdh-db-secret), created once by scripts/bootstrap.sh
# step 4b, never committed.
#
# CREATEDB (DEC-093 addendum; automated by DEC-146, M9): RHDH creates one
# database per backend plugin, so its role needs CREATEDB. The image's own
# start hook (/opt/app-root/src/postgresql-start/*.sh, sourced on every
# start once the server is up, local socket, superuser) grants it from the
# ConfigMap below -- idempotent, no hand step, no ordering race with ArgoCD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-rhdh-db-start-hooks
  labels:
    app.kubernetes.io/part-of: golden-path-agent
data:
  10-rhdh-createdb.sh: |
    # DEC-146 (M9): sourced by the image's run-postgresql (set -eu), so a
    # failure stops the start rather than leaving RHDH half-provisioned.
    psql -v ON_ERROR_STOP=1 -d postgres --command "ALTER ROLE \"${POSTGRESQL_USER}\" CREATEDB;"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golden-path-agent-rhdh-db
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-path-agent-rhdh-db
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC -- a rolling update would try to schedule a
    # second pod against the same volume before the first releases it.
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent-rhdh-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-path-agent-rhdh-db
    spec:
      containers:
        - name: postgresql
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: golden-path-agent-rhdh-db-secret
          readinessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: start-hooks
              mountPath: /opt/app-root/src/postgresql-start
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: golden-path-agent-rhdh-db
        - name: start-hooks
          configMap:
            name: golden-path-agent-rhdh-db-start-hooks
---
apiVersion: v1
kind: Service
metadata:
  name: golden-path-agent-rhdh-db
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  selector:
    app.kubernetes.io/name: golden-path-agent-rhdh-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
