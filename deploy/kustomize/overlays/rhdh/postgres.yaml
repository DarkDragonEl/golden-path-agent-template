# DEC-087: RHDH's own dedicated Postgres, separate from Keycloak's own
# DB, same plain Deployment+PVC pattern (no new operator). GitOps-managed
# (unlike Keycloak's manual bootstrap), since RHDH's Backstage CR is
# GitOps-managed too. Credentials: a plain Secret
# (golden-path-agent-rhdh-db-secret), manually provisioned, never committed.
#
# REQUIRED MANUAL STEP (DEC-093 addendum): RHDH creates one Postgres
# database per backend plugin at startup, not just this S2I image's
# default single database -- the app user needs CREATEDB or every plugin
# fails ("permission denied to create database"). Run once, after this
# Deployment is Running (scripts/bootstrap.sh's --with-rhdh does not
# automate this):
#   oc exec -n golden-path-agent-rhdh <pg-pod> -- \
#     psql -U postgres -d postgres -c "ALTER ROLE rhdh CREATEDB;"
# The grant lives in the role itself -- survives pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golden-path-agent-rhdh-db
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-path-agent-rhdh-db
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC -- a rolling update would try to schedule a
    # second pod against the same volume before the first releases it.
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent-rhdh-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-path-agent-rhdh-db
    spec:
      containers:
        - name: postgresql
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: golden-path-agent-rhdh-db-secret
          readinessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: golden-path-agent-rhdh-db
---
apiVersion: v1
kind: Service
metadata:
  name: golden-path-agent-rhdh-db
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  selector:
    app.kubernetes.io/name: golden-path-agent-rhdh-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
