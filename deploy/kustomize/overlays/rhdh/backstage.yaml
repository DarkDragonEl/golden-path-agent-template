# DEC-092: RHDH's own namespace-scoped `Backstage` CR (AllNamespaces
# install is the Operator's own Subscription; this CR instance stays
# project-owned).
#
# route.enabled: false -- DEC-092: confirmed live, a clean toggle
# suppressing Route creation; this repo's Ingress-only precedent holds
# without exception. Generated Service name: backstage-<CR name>.
#
# database.enableLocalDb: false -- DEC-092: external Postgres
# (postgres.yaml), a separate instance from Keycloak's own DB.
#
# extraEnvs.secrets -- -oidc-secret's keys become env vars oidc-app-
# config.yaml substitutes via ${VAR}, never a plaintext secret here.
#
# dynamicPluginsConfigMapName (DEC-118) -- previously unset, so the
# Operator generated this ConfigMap's content automatically; pointing it
# at dynamic-plugins-config.yaml (this directory) is the first time this
# project customizes RHDH's dynamic-plugin set, adding a live-verified
# publish:gitea Scaffolder action.
#
# extraFiles (DEC-118) -- the plugin-loading init container's own skopeo
# call needs two things a normal kubelet-mediated image pull already gets
# for free: the cluster's own internal-registry CA (config-service-
# cabundle, mounted for every container via containers: ["*"] since the
# init container is a different container than the main one the CA fix
# alone didn't cover) and a registry pull credential (golden-path-agent-
# rhdh-registry-auth -- provisioned by provision-identity-secrets.sh, see
# that script's own comment for a real, named durability caveat). The
# secret mount is deliberately whole-volume (no `key:` field) rather than
# a subPath mount -- a real gap found live: subPath mounts fail with
# "Not a directory" when the parent path doesn't already exist in the
# base image, and cannot create missing multi-level parent directories
# the way a whole-volume mount can.
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: golden-path-agent
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  application:
    route:
      enabled: false
    appConfig:
      configMaps:
        - name: golden-path-agent-rhdh-oidc-config
        - name: golden-path-agent-rhdh-catalog-config
        - name: golden-path-agent-rhdh-techdocs-config
        - name: golden-path-agent-rhdh-cicd-config # DEC-141
    extraEnvs:
      secrets:
        - name: golden-path-agent-rhdh-oidc-secret
        - name: golden-path-agent-rhdh-gitea-scaffolder-secret
        # DEC-143: written by scripts/bootstrap.sh (read-only Argo CD
        # account token) before ArgoCD ever syncs this CR.
        - name: golden-path-agent-rhdh-argocd-secret
      envs:
        # DEC-146 (M13): Node trusts this cluster's ingress + service CAs
        # (the cluster-ca file below), e.g. for the Keycloak Route on a
        # fresh cluster's self-signed ingress certificate. Adds to, never
        # replaces, Node's built-in CA store.
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/containers/certs.d/image-registry.openshift-image-registry.svc:5000/ca-bundle.crt
    dynamicPluginsConfigMapName: golden-path-agent-rhdh-dynamic-plugins
    extraFiles:
      mountPath: /etc/containers/certs.d/image-registry.openshift-image-registry.svc:5000
      configMaps:
        # DEC-146 (C7/M13): written by scripts/bootstrap.sh step 4b from
        # the cluster's own CA ConfigMaps -- replaces the Pipelines-injected
        # config-service-cabundle this CR used to depend on implicitly.
        - name: golden-path-agent-rhdh-cluster-ca
          key: ca-bundle.crt
          containers: ["*"]
        # DEC-144 (M16): the Gitea plugin include (dynamic-plugins-
        # config.yaml), rendered by scripts/bootstrap.sh step 4b.
        - name: golden-path-agent-rhdh-gitea-plugin
          mountPath: /opt/app-root/src/gitea-plugin
          containers: ["*"]
      secrets:
        - name: golden-path-agent-rhdh-registry-auth
          mountPath: /opt/app-root/src/.config/containers
          containers: ["*"]
        # DEC-141: SA token + CA for the Kubernetes plugin (cicd-app-
        # config.yaml reads both by path). Whole-volume, backend container
        # only. Must exist before this syncs: platform/bootstrap/rhdh-
        # kubernetes-rbac.yaml creates it.
        - name: golden-path-agent-rhdh-kubernetes-token
          mountPath: /opt/app-root/src/kubernetes-sa
  database:
    enableLocalDb: false
    authSecretName: golden-path-agent-rhdh-db-secret
