# Phase G, Stage 3 (DECISIONS.md DEC-098/DEC-099/DEC-110/DEC-118, G6 Path
# A landing). Before this file, the Backstage CR's own
# `dynamicPluginsConfigMapName` was unset, so the RHDH Operator generated
# this ConfigMap's content automatically -- this is the first time this
# project customizes RHDH's dynamic-plugin set at all. Taking over means
# taking over the *whole* list, not just adding one entry: `includes:
# [dynamic-plugins.default.yaml]` pulls in RHDH's own base/default set,
# and the two Lightspeed entries below are carried forward unchanged
# (DEC-092/PINS.md: RHDH 1.10 bundles Developer Lightspeed by default;
# this project's own stance has always been to leave it inert, not
# extend it -- dropping these two entries here would be a real,
# accidental behavior change, not a no-op).
#
# The Gitea scaffolder module (DEC-118, live-verified end-to-end) comes
# from the second include: a file scripts/bootstrap.sh renders into
# ConfigMap golden-path-agent-rhdh-gitea-plugin from RHDH_PLUGIN_REGISTRY
# (bootstrap.env) and the digest in platform/rhdh-plugins/gitea-scaffolder/
# pin.env (DEC-145) -- so no registry host is ever committed here.
#
# DEC-141/DEC-143 (CI/CD visibility): Kubernetes backend + frontend and
# Topology are preinstalled in the RHDH 1.10.3 image. Tekton and Argo CD
# (Community family) are not: they are pulled from ghcr.io at pod start,
# pinned by digest (mirroring them is recorded debt, DEC-143).
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-rhdh-dynamic-plugins
  labels:
    app.kubernetes.io/part-of: golden-path-agent
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
      - /opt/app-root/src/gitea-plugin/dynamic-plugins.gitea.yaml
    plugins:
      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-lightspeed:{{inherit}}
        disabled: false
      - package: oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-lightspeed-backend:{{inherit}}
        disabled: false
      # DEC-141: `pluginConfig: {}` replaces (not merges) the default
      # entry's skipTLSVerify cluster stanza; the real `kubernetes:` block
      # lives in cicd-app-config.yaml.
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
        disabled: false
        pluginConfig: {}
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
        disabled: false
      # DEC-143: enabled from ghcr.io, pinned by digest (PINS.md). Tekton
      # uses the default entry's image path (no `!path`), so it overrides
      # that entry and inherits its mount points; Argo CD (Community) has
      # no default entry, so its mount points are spelled out below.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton@sha256:a26ed788824fbd29e65b02f956dad8f35275a8ccd1110b23fc17957104d38a01
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend@sha256:de3a311dafb2a853354f30434451fc04c56b5ee53f085f38471410c695f16e46!backstage-community-plugin-argocd-backend
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd@sha256:4c922b0b3bafaf70925a860a14ce22df5d05e70edb92f0db8608b461f91444bf!backstage-community-plugin-argocd
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-argocd:
                translationResources:
                  - importName: argocdTranslations
                    ref: argocdTranslationRef
                mountPoints:
                  - mountPoint: entity.page.overview/cards
                    importName: ArgocdDeploymentSummary
                    config:
                      layout:
                        gridColumnEnd:
                          lg: span 8
                          xs: span 12
                      if:
                        allOf:
                          - isArgocdConfigured
                  - mountPoint: entity.page.cd/cards
                    importName: ArgocdDeploymentLifecycle
                    config:
                      layout:
                        gridColumn: 1 / -1
                      if:
                        allOf:
                          - isArgocdConfigured
