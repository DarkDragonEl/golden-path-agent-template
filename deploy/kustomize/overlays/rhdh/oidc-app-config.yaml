# Phase F4 (DECISIONS.md DEC-087/DEC-092). RHDH's own sign-in via the
# existing golden-path-agent-keycloak realm (DEC-087 item 2 -- no second
# realm). Values pulled from golden-path-agent-rhdh-oidc-secret via
# Backstage's own ${VAR} env-var substitution (spec.application.extraEnvs
# .secrets on the Backstage CR makes every key in that Secret available as
# an env var) -- never a plaintext secret in this ConfigMap.
#
# Exactly one data entry, per the operator's own documented merge-order
# constraint (docs/configuration.md: "Each app-config ConfigMap must
# contain exactly one data entry").
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-rhdh-oidc-config
  labels:
    app.kubernetes.io/part-of: golden-path-agent
data:
  # Real gap found live (F4, DEC-092): this RHDH version's oidc auth
  # provider rejects the `scope` key outright ("no longer supports the
  # 'scope' configuration option") -- confirmed by the backend actually
  # failing to start with that exact error before this was changed to
  # `additionalScopes`. Not assumed from docs (which still show `scope`
  # in some published examples) -- caught only by running it.
  # Real gap found live (F4, DEC-092): without app/backend.baseUrl set,
  # Backstage defaults to its own internal http://localhost:7007 --
  # every OIDC redirect_uri (and the frontend's own asset/API URLs) came
  # back pointing at that unreachable-from-outside address. PUBLIC_URL
  # is this showcase cluster's own live Ingress hostname -- kept out of
  # git entirely (CLAUDE.md anonymity rule), same reasoning as the
  # Ingress's own host field and the Keycloak client's wildcarded
  # redirectUris; lives only in golden-path-agent-rhdh-oidc-secret,
  # applied out-of-band. This one entry now covers both baseUrl and
  # auth config (not "exactly one *topic* per entry", just one file --
  # the operator's own constraint is about ConfigMap objects, not about
  # how many top-level app-config keys one file's content may have).
  app-config.oidc.yaml: |
    # Real gap found live (F4, DEC-092/DEC-094): signInPage is a TOP-LEVEL
    # config key (a sibling of app/backend/auth/catalog), not a sub-key of
    # auth: -- nesting it under auth: (as an earlier version of this file
    # did) leaves the backend OIDC flow fully functional (proven by a
    # direct API call to /api/auth/oidc/start) while the frontend's own
    # "Select a sign-in method" page silently falls back to RHDH's
    # bundled example GitHub provider, since it never learns which
    # provider to treat as the sign-in page's own selection. Only found
    # by actually opening the portal in a real browser -- every prior
    # check in this phase used a scripted backend-only API call, which
    # cannot see this gap because the backend flow it drives works either
    # way.
    signInPage: oidc
    app:
      baseUrl: ${PUBLIC_URL}
    backend:
      baseUrl: ${PUBLIC_URL}
      cors:
        origin: ${PUBLIC_URL}
    auth:
      # environment: production (not development) -- deliberately, per
      # owner guidance: this also hides the Guest login button on the
      # home page, which is expected/desired here, not a regression --
      # a demo should authenticate through the real Keycloak realm, not
      # a no-auth guest bypass.
      environment: production
      session:
        # Real gap found live (F4, DEC-092): omitting this produces
        # "Authentication failed, authentication requires session
        # support" on the very first /api/auth/oidc/start request --
        # Backstage's OIDC strategy needs a session secret configured
        # even though it otherwise uses cookie-based state, not a full
        # express-session store. Value lives in
        # golden-path-agent-rhdh-oidc-secret's own SESSION_SECRET key,
        # generated the same way as every other secret in this project
        # (openssl rand, never committed).
        secret: ${SESSION_SECRET}
      providers:
        oidc:
          production:
            clientId: ${OIDC_CLIENT_ID}
            clientSecret: ${OIDC_CLIENT_SECRET}
            metadataUrl: ${OIDC_METADATA_URL}
            additionalScopes:
              - profile
              - email
            prompt: consent
            # Sandbox-scope decision, owner-directed (DEC-092): no user/
            # group ingestion is configured for this catalog (only F1's
            # own Component entity exists, zero User entities) --
            # dangerouslyAllowSignInWithoutUserInCatalog lets a real
            # Keycloak-authenticated identity sign in without first
            # existing as a catalog User. Re-entry point if user/group
            # ingestion is ever wanted: the Keycloak catalog-backend
            # plugin, not this flag -- this flag stays a demo-scope
            # shortcut, not a permanent posture.
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
                  dangerouslyAllowSignInWithoutUserInCatalog: true
