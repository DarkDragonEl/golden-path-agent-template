# DEC-092 (addendum): RHDH's own sign-in via the existing golden-path-
# agent-keycloak realm, no second realm. Values pulled from
# -oidc-secret via Backstage's ${VAR} env-var substitution. Exactly one
# data entry per ConfigMap, per the operator's own documented
# merge-order constraint ("Each app-config ConfigMap must contain
# exactly one data entry").
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-rhdh-oidc-config
  labels:
    app.kubernetes.io/part-of: golden-path-agent
data:
  # DEC-093 (addendum): this RHDH version's oidc provider rejects the
  # `scope` key outright ("no longer supports the 'scope' configuration
  # option") -- use `additionalScopes` instead. Without app/backend.
  # baseUrl set, Backstage defaults to internal http://localhost:7007,
  # breaking every OIDC redirect_uri. PUBLIC_URL (this cluster's live
  # Ingress hostname) is kept out of git (CLAUDE.md anonymity rule),
  # lives only in -oidc-secret.
  app-config.oidc.yaml: |
    # DEC-094: signInPage is a TOP-LEVEL config key, not a sub-key of
    # auth: -- nesting it under auth: leaves the backend OIDC flow
    # working while the frontend silently falls back to RHDH's bundled
    # GitHub provider. Only found by opening the portal in a real browser.
    signInPage: oidc
    app:
      baseUrl: ${PUBLIC_URL}
    backend:
      baseUrl: ${PUBLIC_URL}
      cors:
        origin: ${PUBLIC_URL}
    auth:
      # environment: production (not development) -- deliberately, per
      # owner guidance: this also hides the Guest login button on the
      # home page, which is expected/desired here, not a regression --
      # a demo should authenticate through the real Keycloak realm, not
      # a no-auth guest bypass.
      environment: production
      session:
        # DEC-093 (addendum): omitting this produces "Authentication
        # failed, authentication requires session support" on the first
        # /api/auth/oidc/start request -- needed even though the OIDC
        # strategy otherwise uses cookie-based state, not express-session.
        # Value lives in -oidc-secret's SESSION_SECRET key.
        secret: ${SESSION_SECRET}
      providers:
        oidc:
          production:
            clientId: ${OIDC_CLIENT_ID}
            clientSecret: ${OIDC_CLIENT_SECRET}
            metadataUrl: ${OIDC_METADATA_URL}
            additionalScopes:
              - profile
              - email
            prompt: consent
            # DEC-092: sandbox-scope, owner-directed -- no user/group
            # ingestion configured (zero User entities), so this lets a
            # real Keycloak identity sign in without a catalog User.
            # Re-entry point if ingestion is ever wanted: the Keycloak
            # catalog-backend plugin, not this flag.
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
                  dangerouslyAllowSignInWithoutUserInCatalog: true
