# DEC-101: the approval service's Platform Foundation home -- a shared
# singleton. Deliberately standalone, not `resources: [../../base]`:
# ephemeral-test still needs its own throwaway approval instance, so
# `../../base` keeps its own copies too; this directory holds
# independent copies to avoid entangling the two.
#
# Own `images:` transform, same digest as base/'s pin: open-promotion-pr
# updates both in one PR and tests/test_image_pins.py fails on drift
# (DEC-147, M21). Not a shared Component: a Component's images transform
# runs before base's own, which would defeat deploy-ephemeral's
# `kustomize edit set image` override in base/.
namespace: golden-path-agent-approval

resources:
  - serviceaccount-approval.yaml
  - configmap-approval.yaml
  - pvc-approval.yaml
  - deployment-approval.yaml
  - service-approval.yaml
  - networkpolicy-approval.yaml
  - ingress-approval.yaml
  - pdb-approval.yaml

images:
  - name: golden-path-agent-approval
    newName: image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent-approval
    digest: sha256:e22f0577229b412d8bfc4b3135f5a215f68430c52de77a10603770f2185f0f71
