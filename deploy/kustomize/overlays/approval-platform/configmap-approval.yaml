# Copied from deploy/kustomize/base/configmap-approval.yaml (Phase G,
# Stage 1 held tail, DEC-098/DEC-099/DEC-101) and adjusted for this
# overlay's own single deployment target -- a standalone Platform
# Foundation singleton, not layered across ephemeral-test/demo-prod like
# base's own copy is. AUTH_MODE=oidc and the real cluster OTel endpoint
# are baked in directly here (rather than left "none"/empty for a
# demo-prod-style overlay to override), since this overlay only ever has
# one target: the shared, already-OIDC-cut-over production instance
# (DEC-063's own D2 binding requirement, carried forward unchanged).
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-approval-config
data:
  APPROVAL_DB_PATH: "./state/approval/approvals.db"
  APPROVAL_TIMEOUT_SECONDS: "3600"
  AUTH_MODE: "oidc"
  APPROVER_ROLE_CLAIM: "roles"
  APPROVER_ROLE_VALUE: "approval-approver"
  OIDC_ISSUER_URL: "http://golden-path-agent-service.golden-path-agent-keycloak.svc.cluster.local:8080/realms/golden-path-agent"
  OIDC_AUDIENCE: "golden-path-agent-approval"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://golden-path-agent-otel-collector.golden-path-agent-otel.svc.cluster.local:4318" # DEC-071
  OTEL_SERVICE_NAME: "golden-path-agent-approval"
