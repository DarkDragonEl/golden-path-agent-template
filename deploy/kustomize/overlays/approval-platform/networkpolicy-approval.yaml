# DEC-098/DEC-099: copied from base/, adjusted for cross-namespace
# access (approval now lives in its own namespace). Scoped by this
# project's `part-of: golden-path-agent` namespace label, single-tenant
# for now -- G7's multi-tenant fan-out will need to revisit this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: golden-path-agent-approval-restrict
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent
      app.kubernetes.io/component: approval
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: golden-path-agent
      ports:
        - port: 8082
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: "" # standard OpenShift
              # SDN/OVN convention for "traffic from the router" -- same
              # label base's own copy already used, unchanged here.
      ports:
        - port: 8082
          protocol: TCP
