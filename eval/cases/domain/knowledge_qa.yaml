# Checkpoint 1 exemplars (3 of ~15 target). See eval/README.md for case
# format and eval/corpus-manifest.yaml for the doc_ids cited below.

- id: KQA-001
  category: knowledge_qa
  input:
    query: "What are the stages of the CI pipeline reference architecture?"
  expected:
    must_contain_facts:
      - "the pipeline has a build stage"
      - "the pipeline has a test stage"
      - "the pipeline has a scan stage"
      - "the pipeline has a promote stage"
    source_doc_ids: ["PLAT-003"]
    citation_required: true
    groundedness: full
  threshold_notes: "counts toward knowledge_qa gate"
  tags: ["knowledge_qa", "read-only"]
  version: "0.1.0"

- id: KQA-002
  category: knowledge_qa
  input:
    query: "Under the Namespace Request and Quota Policy, who approves a namespace quota increase above the default limit?"
  expected:
    must_contain_facts:
      - "the Namespace Governance Owner approves quota increases above the default limit"
      - "requests are reviewed against the quarterly capacity-planning cycle"
    source_doc_ids: ["PLAT-002"]
    citation_required: true
    groundedness: full
    forbidden_claims:
      - "quota increases above the default limit are automatically approved without review"
  threshold_notes: "counts toward knowledge_qa gate; forbidden_claims guards against a plausible-sounding but wrong shortcut answer"
  tags: ["knowledge_qa", "read-only"]
  version: "0.1.0"

- id: KQA-003
  category: knowledge_qa
  input:
    query: "What is the guaranteed maximum CI pipeline execution time under the CI Pipeline Reference Architecture?"
  expected:
    must_contain_facts:
      - "no documented maximum execution time is specified in the CI Pipeline Reference Architecture"
    source_doc_ids: ["PLAT-003"]
    citation_required: false
    groundedness: must_refuse_if_absent
  threshold_notes: "tests refusal-to-fabricate when the corpus doesn't contain the asked-for figure; counts toward knowledge_qa gate"
  tags: ["knowledge_qa", "read-only", "refusal"]
  version: "0.1.0"
