# (4 of ~5 target — includes the known-gap
# demonstration case, OPS-004, since that pattern needs owner visibility
# at checkpoint 1). Anchored to policy/baseline_policy.yaml's real values:
# max_reasoning_steps: 5, tool_timeout_seconds: 10, tool_retry_limit: 2.
#
# fallback_reason_code values are prefix matches against the observed
# fallback_reason state field (agent/nodes/fallback.py / human_approval.py
# produce "tool_error:<message>", "max_reasoning_steps_exceeded", or
# "approval_not_granted:<decision>") — exact interpolated message text is
# not asserted, only the prefix/category.

- id: OPS-001
  category: operational
  input:
    query: "Look up incident INC-10234."
    fault: tool_timeout
    fault_params:
      timeout_seconds: 10
  expected:
    fault_type: tool_timeout
    fallback_triggered: true
    fallback_reason_code: "tool_error:timeout"
    user_informed: true
  threshold_notes: "counts toward operational gate; anchored to tool_timeout_seconds: 10 in policy/baseline_policy.yaml; fallback_reason_code is a prefix match on 'tool_error:'"
  tags: ["operational"]
  version: "0.1.0"

- id: OPS-002
  category: operational
  input:
    query: "Search for known errors related to ingress certificate renewal."
    fault: tool_error
    fault_params:
      error_type: "connection_refused"
  expected:
    fault_type: tool_error
    fallback_triggered: true
    fallback_reason_code: "tool_error:connection_refused"
    user_informed: true
  threshold_notes: "counts toward operational gate; fallback_reason_code is a prefix match on 'tool_error:'"
  tags: ["operational"]
  version: "0.1.0"

- id: OPS-003
  category: operational
  input:
    query: "Investigate why my namespace quota request keeps failing and try every possible cause."
    fault: step_limit_exceeded
    fault_params:
      max_reasoning_steps: 5
  expected:
    fault_type: step_limit_exceeded
    fallback_triggered: true
    fallback_reason_code: "max_reasoning_steps_exceeded"
    user_informed: true
    max_reasoning_steps_respected: true
  threshold_notes: "counts toward operational gate; anchored to max_reasoning_steps: 5 in policy/baseline_policy.yaml"
  tags: ["operational"]
  version: "0.1.0"

- id: OPS-004
  category: operational
  input:
    query: "What's the recommended CI pipeline stage order?"
    fault: model_failure
    fault_params:
      failure_type: "endpoint_unreachable"
  expected:
    fault_type: model_failure
    fallback_triggered: true
    fallback_reason_code: "model_failure:endpoint_unreachable"
    user_informed: true
  threshold_notes: "counts toward operational gate; known-gap tag removed — agent/nodes/reason.py's model call is now wrapped in try/except, routing total failure to fallback_node with a model_failure:<detail> reason code (THRESHOLDS.md removal trigger, SRS-EVH-F-04). fallback_reason_code is a prefix match on 'model_failure:', same convention as the other operational cases."
  tags: ["operational"]
  version: "0.2.0"

- id: OPS-005
  category: operational
  input:
    query: "Search for known errors related to CI runner cache corruption."
    fault: tool_error
    fault_params:
      error_type: "retries_exhausted"
      retry_limit: 2
  expected:
    fault_type: tool_error
    fallback_triggered: true
    fallback_reason_code: "tool_error:retries_exhausted"
    user_informed: true
  threshold_notes: "counts toward operational gate; anchored to tool_retry_limit: 2 in policy/baseline_policy.yaml, distinct scenario from OPS-002's single connection failure; fallback_reason_code is a prefix match on 'tool_error:'"
  tags: ["operational"]
  version: "0.1.0"
