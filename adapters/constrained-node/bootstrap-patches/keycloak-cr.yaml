# Shared/single-node profile -- see keycloak-postgres.yaml's own
# header comment in this same directory for the full reasoning.
# Keycloak's operator CRD exposes spec.resources directly (verified
# live: `oc explain keycloak.spec.resources`), a standard
# requests/limits ResourceList shape.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: golden-path-agent
spec:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
