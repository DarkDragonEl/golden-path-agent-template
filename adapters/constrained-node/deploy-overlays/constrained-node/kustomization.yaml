apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ADAPTER, NOT PART OF THE GOLDEN PATH -- see ../../README.md.
# Shared/single-node profile: lowers this project's own committed CPU/
# memory *requests* to a few tens of millicores and a few dozen Mi --
# the actual constraint on a busy shared node is what gets requested at
# schedule time, not what's actually used (confirmed live: ~7% CPU
# utilization against the node's own allocatable capacity). Limits are
# left as demo-prod's own base/ values -- generous headroom for a real
# burst, Burstable QoS rather than Guaranteed. base/ itself is
# unchanged; this is a selectable environment variant, not a base
# change.
resources:
  - ../../../../deploy/kustomize/overlays/demo-prod

patches:
  - target:
      kind: Deployment
      name: golden-path-agent
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
  - target:
      kind: Deployment
      name: golden-path-agent-mcp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 32Mi

# golden-path-agent-approval's own Deployment is deleted from this tree
# by demo-prod/kustomization.yaml's own patches (ADR-012 -- approval
# moves to overlays/approval-platform/ as a shared singleton), so no
# approval patch belongs here; see
# deploy/kustomize/overlays/approval-platform/ for that Deployment's
# own constrained-node treatment.
