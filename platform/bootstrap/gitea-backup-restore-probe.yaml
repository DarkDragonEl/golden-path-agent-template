# One-time backup/restore exercise for Gitea's data
# PVC, per G1's DoD. Uses the cluster's existing CSI RBD
# VolumeSnapshotClass (`ocs-external-storagecluster-rbdplugin-snapclass`)
# -- a one-shot probe, not a recurring backup schedule.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: golden-path-agent-gitea-backup-probe
  namespace: golden-path-agent-gitea
spec:
  volumeSnapshotClassName: ocs-external-storagecluster-rbdplugin-snapclass
  source:
    persistentVolumeClaimName: golden-path-agent-gitea-pvc
