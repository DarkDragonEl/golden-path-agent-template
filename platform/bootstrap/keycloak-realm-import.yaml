# One realm, one approval-approver role, three clients, two
# test users. Schema confirmed against the live CRD, not guessed.
#
# Deliberately secret-free -- client secrets and
# test-user passwords are both provisioned post-apply by
# provision-identity-secrets.sh via Keycloak's admin API (one code path
# for both fresh-environment and rotation), not this CRD's
# `spec.placeholders` mechanism.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: golden-path-agent
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  keycloakCRName: golden-path-agent
  realm:
    realm: golden-path-agent
    enabled: true
    roles:
      realm:
        - name: approval-approver
          description: "Authorized to decide (approve/reject) pending write proposals -- SRS-APR-SEC-02."
    clients:
      # ADR-017 (addendum): agent workload -> approval-service. Never
      # assigned approval-approver -- correct by omission, nothing to
      # misconfigure to "block" it, which is what makes the negative
      # test possible.
      - clientId: golden-path-agent-approval-workload
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        protocolMappers:
          - name: audience-approval-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: golden-path-agent-approval
              access.token.claim: "true"
              id.token.claim: "false"
          - name: realm-roles-flat-claim
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              claim.name: roles
              jsonType.label: String
              multivalued: "true"
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
      # Agent workload -> MCP tool server (the "mock-ITSM credential",
      # DECISIONS.md D2 design-STOP shape) -- a separate credential from
      # the approval-workload client above, deliberately, so a compromise
      # of one never also grants the other (this project's own
      # established "independent security boundaries even when sharing
      # was technically possible" pattern).
      - clientId: golden-path-agent-mcp-workload
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        protocolMappers:
          - name: audience-mcp-server
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: golden-path-agent-mcp
              access.token.claim: "true"
              id.token.claim: "false"
          - name: realm-roles-flat-claim
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              claim.name: roles
              jsonType.label: String
              multivalued: "true"
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
      # Human-facing -- D2's own verification test AND D3's real UI,
      # public client, Authorization Code + PKCE (the standard shape for
      # a browser client with no safely-embeddable secret). Audience
      # matches the approval-workload client's -- both legitimately talk
      # to the same approval-service, just as different callers with
      # different roles.
      - clientId: golden-path-agent-approver-ui
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        # Also enables Resource Owner Password (direct grant) on
        # this same client, deliberately, for D2's own verification test
        # only (no browser available there) -- still a real login, not
        # an admin-tooling shortcut. D3's real UI uses Authorization
        # Code+PKCE exclusively, never this grant.
        directAccessGrantsEnabled: true
        redirectUris:
          - "*" # TODO(D3): tighten to the real UI's callback URL once it exists -- wildcard only acceptable at this demo/verification stage
        webOrigins:
          - "*" # TODO(D3): same deferral as redirectUris above
        attributes:
          pkce.code.challenge.method: S256
        protocolMappers:
          - name: audience-approval-service
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.custom.audience: golden-path-agent-approval
              access.token.claim: "true"
              id.token.claim: "false"
          - name: realm-roles-flat-claim
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              claim.name: roles
              jsonType.label: String
              multivalued: "true"
              access.token.claim: "true"
              id.token.claim: "false"
              userinfo.token.claim: "false"
      # RHDH's own sign-in -- confidential client,
      # standard Authorization Code flow (Backstage's backend OIDC
      # plugin handles the exchange server-side), a genuinely distinct
      # trust surface from golden-path-agent-approver-ui's public
      # PKCE-only shape above -- dev-tooling sign-in vs. end-user
      # approval auth. Same realm reused, no second realm.
      - clientId: golden-path-agent-rhdh
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - "*" # TODO(F4 follow-up): tighten to the real RHDH Ingress
          # host's callback path once a stable, non-ephemeral hostname
          # exists -- same wildcard-at-demo-stage precedent as
          # golden-path-agent-approver-ui above, and for the same reason:
          # this showcase cluster's own hostname is sandbox-specific and
          # not committed to Git (CLAUDE.md anonymity rule); the real
          # value is applied live only, never here.
        webOrigins:
          - "*" # TODO(F4 follow-up): same deferral as redirectUris above
    users:
      # At minimum one user with the approver role, one without
      # -- the wrong-role 403 negative test needs a real human token.
      # email/firstName/lastName/emailVerified are NOT cosmetic: without
      # them, Keycloak's User Profile feature refuses direct-grant login
      # with "Account is not fully set up". Synthetic values only
      # (CLAUDE.md).
      - username: demo-approver
        enabled: true
        email: demo-approver@example.invalid
        firstName: Demo
        lastName: Approver
        emailVerified: true
        realmRoles:
          - approval-approver
      - username: demo-user
        enabled: true
        email: demo-user@example.invalid
        firstName: Demo
        lastName: User
        emailVerified: true
        realmRoles: []
