# DEC-092: RHDH's OperatorHub packagemanifest supports only AllNamespaces
# install (confirmed live via packagemanifest) -- goes into
# openshift-operators, reusing scripts/bootstrap.sh's existing
# wait_for_csv/approve_pending_installplan mechanism (DEC-080). Applied
# manually, never by the CI pipeline's ServiceAccount.
#
# DEC-092 (addendum): AllNamespaces means this operator is visible to
# every tenant on this shared cluster -- the same precedent already
# accepted for Pipelines/GitOps, not a new exposure class.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhdh
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  channel: fast-1.10
  name: rhdh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
  startingCSV: rhdh-operator.v1.10.3
