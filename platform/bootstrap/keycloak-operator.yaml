# CRD registration is structurally cluster-scoped for any
# operator install. OperatorGroup/Subscription are namespace-scoped (no
# AllNamespaces -- unsupported). ADR-017 found the functionally-
# equivalent upstream manifests carry exactly one ClusterRoleBinding,
# read-only `config.openshift.io/ingresses`.
#
# BLOCKED LIVE (ADR-017), NOT applied: a different tenant's
# broken CatalogSource poisons OLM's cluster-wide resolution (Red Hat KB
# 7052456) -- not this project's resource to fix. D2 proceeded via
# keycloak-operator-upstream/ instead. Kept committed as documented tech
# debt: migrate to rhbk-operator via this file once the shared cluster's
# catalog is healthy (the CRD group is identical either way).
#
# Applied manually, by a human with cluster-admin-adjacent access, same
# category as pipelines/bootstrap/namespaces.yaml/rbac.yaml -- never by
# the CI pipeline's own ServiceAccount (which has zero cluster-scoped
# grants, deliberately).
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: golden-path-agent-keycloak
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  targetNamespaces:
    - golden-path-agent-keycloak
---
# PINS.md: rhbk-operator, channel stable-v26.6, CSV
# rhbk-operator.v26.6.6-opr.1, catalog redhat-operators -- re-verified
# live 2026-08-22, byte-identical to the original research.
# installPlanApproval: Manual + startingCSV pinned to this
# exact CSV, deliberately not OLM's default auto-upgrade behavior --
# this project's own "pin exact versions" discipline (CLAUDE.md's "Reuse
# over building" rule), applied to an operator subscription the same way
# it has been applied to every other pinned component in PINS.md.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  channel: stable-v26.6
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
  startingCSV: rhbk-operator.v26.6.6-opr.1
