# Keycloak's own database, plain Deployment+PVC, no new
# operator. OpenShift's built-in openshift/postgresql:15-el9 ImageStream
# is already S2I-shaped, avoiding a second restricted-v2 SCC fight.
#
# Credentials are a plain Secret, manually provisioned, never
# committed. Expected keys: POSTGRESQL_USER/PASSWORD/DATABASE.
#
# Same manual, human-applied bootstrap discipline as
# namespaces.yaml/rbac.yaml -- namespace-scoped only, no cluster-scoped
# grant.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golden-path-agent-keycloak-db
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-path-agent-keycloak-db
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC -- a rolling update would try to schedule a
    # second pod against the same volume before the first releases it.
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent-keycloak-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-path-agent-keycloak-db
    spec:
      containers:
        - name: postgresql
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: golden-path-agent-keycloak-db-secret
          readinessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: golden-path-agent-keycloak-db
---
apiVersion: v1
kind: Service
metadata:
  name: golden-path-agent-keycloak-db
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  selector:
    app.kubernetes.io/name: golden-path-agent-keycloak-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
