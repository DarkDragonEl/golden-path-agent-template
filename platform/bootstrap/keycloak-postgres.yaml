# Phase D, D2 entry gate (DECISIONS.md DEC-053). Keycloak's own
# database -- a plain Deployment+PVC, no new operator (the Phase D plan's
# own D2 decision). PINS.md: image is OpenShift's built-in
# openshift/postgresql:15-el9 ImageStream tag, referenced via the
# internal registry's stable service DNS -- already S2I/OpenShift-
# runtime-shaped (arbitrary non-root UID support built in), so this
# avoids a second, independent instance of the restricted-v2 SCC fight
# class deploy/Containerfile already had to solve once for this
# project's own image (DEC-026-034).
#
# Credentials: a plain Secret, manually provisioned out-of-band, never
# committed -- the same established pattern as golden-path-agent-secrets
# (docs/phase-c-runbook.md Sec.2, DECISIONS.md DEC-024's secret-handling
# decision), applied here rather than inventing a new mechanism. Expected
# keys: POSTGRESQL_USER, POSTGRESQL_PASSWORD, POSTGRESQL_DATABASE (the
# OpenShift postgresql S2I image's own required env vars).
#
# Same manual, human-applied bootstrap discipline as
# pipelines/bootstrap/namespaces.yaml/rbac.yaml and this file's own
# sibling keycloak-operator.yaml (both now under platform/bootstrap/,
# Phase G G1, DEC-098/DEC-099) --
# namespace-scoped only, no cluster-scoped grant. Per the owner's own
# instruction: prepared now, applied only once the D2 design STOP is
# past and the owner has authorized moving into implementation.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: golden-path-agent-keycloak-db
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-path-agent-keycloak-db
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC -- a rolling update would try to schedule a
    # second pod against the same volume before the first releases it.
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent-keycloak-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-path-agent-keycloak-db
    spec:
      containers:
        - name: postgresql
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
          ports:
            - name: postgresql
              containerPort: 5432
          envFrom:
            - secretRef:
                name: golden-path-agent-keycloak-db-secret
          readinessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: golden-path-agent-keycloak-db
---
apiVersion: v1
kind: Service
metadata:
  name: golden-path-agent-keycloak-db
  namespace: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  selector:
    app.kubernetes.io/name: golden-path-agent-keycloak-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
