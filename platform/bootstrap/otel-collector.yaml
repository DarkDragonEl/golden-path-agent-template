# DEC-068: cluster-tier OTel Collector, a plain Deployment (same pinned
# image the local-dev collector uses) rather than the
# opentelemetry-operator route -- avoids a second operator install
# risking the same shared-catalog blocker class as DEC-055/DEC-056.
#
# Exporters: `debug` (live `oc logs` visibility during a demo) AND
# `file` (JSON Lines to an emptyDir volume) together -- `file` is what
# makes D4's own trace-continuity verification possible without a full
# Jaeger/Tempo install (the owner's own explicitly-offered lighter
# option: "a collector-with-file/OTLP-export plus a scripted query view
# is an acceptable honest realization"). `tools/query_traces.py` is that
# scripted query view -- filters this file by session.id/proposal.id,
# the attribute-correlation mechanism D1's own plan doc already settled
# on for stitching the async approval gap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-path-agent-otel-collector-config
  namespace: golden-path-agent-otel
  labels:
    app.kubernetes.io/part-of: golden-path-agent
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: basic
      file:
        path: /var/otel/traces.jsonl
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug, file]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-path-agent-otel-collector
  namespace: golden-path-agent-otel
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-path-agent-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-path-agent-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: docker.io/otel/opentelemetry-collector:0.159.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: traces
              mountPath: /var/otel
        # DEC-068: the upstream collector image is fully distroless -- no
        # shell, no `tar`, nothing `oc exec`/`oc cp` can read the file
        # exporter's output. This sidecar shares the `traces` emptyDir
        # and serves it over plain HTTP for tools/query_traces.py.
        - name: traces-http
          # DEC-119 (not DEC-085, a prior mis-citation corrected there):
          # the original pin reused this project's own CI ImageStream
          # image, which prunes old digests by design -- the pinned digest
          # got pruned, causing a 12h+ ImagePullBackOff that starved the
          # whole collector Service (both containers must be Ready).
          # Repinned to a Red Hat UBI image (registry.access.redhat.com),
          # no relationship to this project's CI/promotion lifecycle, so
          # this failure class cannot recur.
          image: registry.access.redhat.com/ubi9/python-312-minimal@sha256:813ff135a87941ab1417b50c8db68a84ee40a8fc484c87f8a80458d3cafe74b1
          # DEC-068: port 19999, not 8888 -- confirmed live that something
          # in this cluster's networking layer already occupies 8888 in
          # every pod's network namespace. Not investigated further, same
          # posture as DEC-034/DEC-051's own accepted quirks.
          command: ["python3", "-m", "http.server", "19999", "--bind", "0.0.0.0", "--directory", "/var/otel"]
          ports:
            - name: traces-http
              containerPort: 19999
          readinessProbe:
            tcpSocket:
              port: traces-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: traces
              mountPath: /var/otel
      volumes:
        - name: config
          configMap:
            name: golden-path-agent-otel-collector-config
        - name: traces
          emptyDir: {} # demo-scope: survives the pod's own lifetime, not a PVC --
          # a human-latency-scale approval wait (minutes, not the pod's own
          # restart cycle) is well within this, and losing trace history on a
          # pod restart is an acceptable tradeoff at this milestone's scope.
---
apiVersion: v1
kind: Service
metadata:
  name: golden-path-agent-otel-collector
  namespace: golden-path-agent-otel
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  selector:
    app.kubernetes.io/name: golden-path-agent-otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: traces-http
      port: 8888
      targetPort: traces-http
