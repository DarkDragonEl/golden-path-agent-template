# DEC-100 (addendum): the Gitea instance -- one shared Platform
# Foundation instance, not per-agent-project. Admin password via a
# Secret (giteaAdminPasswordSecretName), created out-of-band, never
# plaintext in Git.
#
# giteaSsl: true -- native Route with the cluster's trusted wildcard
# cert (RHDH's own Route, DEC-094; Keycloak's, DEC-097).
apiVersion: pfe.rhpds.com/v1
kind: Gitea
metadata:
  name: golden-path-agent-gitea
  namespace: golden-path-agent-gitea
spec:
  giteaImageTag: 1.25.5.2
  giteaImagePullPolicy: IfNotPresent
  giteaSsl: true
  giteaVolumeSize: 4Gi
  postgresqlVolumeSize: 4Gi
  giteaAdminUser: golden-path-agent-admin
  giteaAdminEmail: golden-path-agent-admin@example.com
  giteaAdminPasswordSecretName: golden-path-agent-gitea-admin-password
