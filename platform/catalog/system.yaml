# DEC-098: the Platform Foundation as a Backstage/RHDH System entity --
# the grouping node the catalog graph hangs off of: platform -> tools ->
# agents. Registered live in RHDH's catalog.locations (DEC-102).
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: golden-path-agent-platform-foundation
  description: >-
    Shared platform services for the Agentic AI Platform golden path --
    identity, telemetry, the approval service, Git hosting, model routes,
    GitOps machinery, and the Internal Developer Portal (RHDH) itself.
    Stood up once per environment (DEC-098's Layer/Platform-Foundation
    decision); not produced per agent-project instantiation.
  tags:
    - agentic-ai
    - golden-path
    - platform-foundation
spec:
  owner: group:default/golden-path-agent-team
