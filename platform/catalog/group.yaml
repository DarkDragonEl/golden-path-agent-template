# DEC-146 (M26): the Group every blueprint entity names as its owner
# (group:default/golden-path-agent-team). Without it the catalog shows an
# unresolved-owner warning on each of them (DEC-097). No members: user
# ingestion stays off (oidc-app-config.yaml's sign-in resolver).
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: golden-path-agent-team
  description: Owners of the golden-path agent blueprint and its Platform Foundation.
spec:
  type: team
  children: []
