# SysR-P-F-06 -- promotion is exclusively a GitOps PR merge, never a
# rebuild and never a direct push to main. This Task only runs when
# every prior gate passed (the Pipeline's `when:` condition, not this
# Task's own logic) and only ever touches the GitOps repo's own
# kustomize/base/kustomization.yaml's one images.digest field.
#
# The GitOps repo layout has kustomize/, argocd/, otel/ at its own root
# (no deploy/ prefix), separate from this Task's own source workspace;
# deploy/kustomize/base/kustomization.yaml does not exist there once a
# project is actually published via tools/gitea_publish.py. This Task
# clones the separate '<repoName>-gitops' repo into its own scratch
# subdirectory of the shared workspace and edits/commits/pushes there
# instead -- the source workspace's own checked-out content is
# untouched.
#
# Credential: a Gitea access token scoped to this one '<repoName>-gitops'
# repo (create/push + PR), stored as Secret ${{ values.name }}-gitea-token
# in ${{ values.name }}-ci, keys `token`/`username` -- same
# manually-provisioned-per-project pattern this Task's own prior
# GitHub-based version already used (docs/phase-c-runbook.md §3), now
# targeting the Platform Foundation's own shared Gitea instance instead.
# Never a pipeline param, never in this Task's own args (only as env
# vars sourced from the Secret, which Tekton does not log), never
# echoed by any step below.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: open-promotion-pr
  namespace: ${{ values.name }}-ci
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
spec:
  params:
    - name: image-ref
      type: string
      description: Full pushed image reference including digest.
    - name: commit-sha
      type: string
  workspaces:
    - name: source
  steps:
    - name: commit-and-push-branch
      image: docker.io/alpine/git:2.54.0
      workingDir: $(workspaces.source.path)
      env:
        - name: GITEA_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${{ values.name }}-gitea-token
              key: token
        - name: GITEA_USERNAME
          valueFrom:
            secretKeyRef:
              name: ${{ values.name }}-gitea-token
              key: username
      script: |
        #!/bin/sh
        set -eu
        BRANCH="promote/$(params.commit-sha)"
        GITOPS_DIR=".gitops-clone"
        rm -rf "$GITOPS_DIR"
        git clone -q "https://${GITEA_USERNAME}:${GITEA_TOKEN}@${{ values.gitHost }}/${{ values.repoOwner }}/${{ values.repoName }}-gitops.git" "$GITOPS_DIR"
        cd "$GITOPS_DIR"
        sed -i "s#digest: sha256:.*#digest: $(echo "$(params.image-ref)" | sed 's/.*@//')#" \
          kustomize/base/kustomization.yaml
        git config user.name "${{ values.name }}-ci"
        git config user.email "${{ values.name }}-ci@users.noreply.example.org"
        git checkout -b "$BRANCH"
        git add kustomize/base/kustomization.yaml
        git commit -q -m "Promote $(params.commit-sha): $(params.image-ref)"
        # Gitea's own git-over-HTTPS auth accepts standard HTTP Basic auth
        # (username:token), already embedded in the clone URL above, the
        # same pattern tools/gitea_publish.py's own push_directory() uses.
        git push -q origin "$BRANCH:$BRANCH"
        echo "$BRANCH" > $(workspaces.source.path)/.promotion-branch

    - name: open-pr
      image: docker.io/alpine/git:2.54.0
      workingDir: $(workspaces.source.path)
      env:
        - name: GITEA_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${{ values.name }}-gitea-token
              key: token
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache curl python3 >/dev/null
        BRANCH=$(cat $(workspaces.source.path)/.promotion-branch)
        BODY=$(python3 -c "
        import json
        print(json.dumps({
            'title': 'Promote ' + '$(params.commit-sha)'[:12],
            'head': '$BRANCH',
            'base': 'main',
            'body': 'Automated digest promotion PR. Image: $(params.image-ref)\n\nOnly kustomize/base/kustomization.yaml\'s images.digest field changes. Merging this is the promotion event (SysR-P-F-06) -- demo-prod syncs from it via ArgoCD.',
        }))
        ")
        # Gitea's PR-creation endpoint (api/v1/repos/{owner}/{repo}/pulls),
        # token auth via the `token` scheme header -- same convention
        # tools/gitea_publish.py uses.
        curl -sf -X POST \
          -H "Authorization: token ${GITEA_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$BODY" \
          https://${{ values.gitHost }}/api/v1/repos/${{ values.repoOwner }}/${{ values.repoName }}-gitops/pulls
