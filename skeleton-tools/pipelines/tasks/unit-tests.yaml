# SysR-P-F-05(1) software tests. Same command a developer runs locally
# (make test / pytest -q) -- no CI-specific reinterpretation of what
# "tests pass" means.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-tests
  namespace: ${{ values.name }}-ci
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
spec:
  workspaces:
    - name: source
  steps:
    - name: pytest
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        # Under this project's own restricted-v2-SCC ServiceAccount (no
        # anyuid grant, deliberately), the container runs as an
        # arbitrary non-root UID with no /etc/passwd entry -- $HOME
        # defaults to "/", which pip's --user install target then can't
        # write to ("Permission denied: '/.local'"). /tmp is used
        # deliberately over /tekton/home: /tmp is guaranteed
        # world-writable by plain container/OS convention regardless of
        # arbitrary UID, whereas /tekton/home's writability under this
        # specific Tekton/SCC combination is not guaranteed.
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q -r requirements.txt -r requirements-dev.txt
        # HOME=/tmp above makes pip fall back to --user mode, installing
        # scripts (including the pytest binary) to /tmp/.local/bin --
        # not on $PATH. python -m pytest finds the installed package via
        # sys.path instead of relying on a PATH lookup, exactly like
        # eval-gate-offline.yaml's python -m eval.cli already does.
        python -m pytest -q
