# Phase G, Stage 2 (DEC-098/DEC-099). This template's own independent
# build/test/promote pipeline -- the Tools Template is a standalone
# artifact from the start, not carved out of a combined repo after the
# fact. Gate set: unit tests plus mcp-operational-test.yaml's two checks
# against the freshly-deployed pod. No eval-gate/policy-validate/
# security-tests -- those are agent-reasoning-specific and belong to the
# Agent Template's own pipeline, not this one.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ${{ values.name }}-ci
  namespace: ${{ values.name }}-ci
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
    app.kubernetes.io/component: mcp
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/${{ values.repoOwner }}/${{ values.repoName }}.git
    - name: revision
      type: string
      default: main
    - name: image-repo
      type: string
      default: image-registry.openshift-image-registry.svc:5000/${{ values.name }}-ci/${{ values.name }}

  workspaces:
    - name: source

  tasks:
    - name: fetch-source
      taskRef: { name: fetch-source }
      workspaces: [{ name: source, workspace: source }]
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

    - name: unit-tests
      taskRef: { name: unit-tests }
      runAfter: [fetch-source]
      workspaces: [{ name: source, workspace: source }]

    - name: container-build
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: namespace, value: openshift-pipelines }
      runAfter: [unit-tests]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: IMAGE
          value: "$(params.image-repo):pr-$(tasks.fetch-source.results.commit-sha)"
        - name: DOCKERFILE
          value: ./Containerfile

    - name: digest-capture
      taskRef: { name: digest-capture }
      runAfter: [container-build]
      params:
        - name: imagestream-tag
          value: "${{ values.name }}:pr-$(tasks.fetch-source.results.commit-sha)"

    - name: sbom-generate
      taskRef: { name: sbom-generate }
      runAfter: [digest-capture]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"

    - name: deploy-ephemeral
      taskRef: { name: deploy-ephemeral }
      runAfter: [digest-capture]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"

    - name: mcp-operational-test
      taskRef: { name: mcp-operational-test }
      runAfter: [deploy-ephemeral]

    - name: open-promotion-pr
      taskRef: { name: open-promotion-pr }
      runAfter: [mcp-operational-test, sbom-generate]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"
        - name: commit-sha
          value: "$(tasks.fetch-source.results.commit-sha)"

  finally:
    - name: destroy-ephemeral
      taskRef: { name: destroy-ephemeral }
      workspaces: [{ name: source, workspace: source }]
