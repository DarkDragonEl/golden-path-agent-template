apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.name }}
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: ${{ values.name }}
      containers:
        - name: mcp
          # The Tools Template's own independently-built/promoted image
          # -- this repo's sole deployable, no positional-arg role
          # dispatch.
          image: ${{ values.name }}
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: ${{ values.name }}-config
          # FastMCP's streamable-HTTP transport speaks the MCP protocol on
          # this port, not a plain REST /healthz route — probe the socket
          # rather than assuming an HTTP path that doesn't exist here.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
