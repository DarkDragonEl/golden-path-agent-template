# Phase F5 (DECISIONS.md DEC-087 item 1; docs/phase-f-kickoff-plan.md SS6).
# Wraps F2/F3's own skeleton/ + template-schema.json in a Backstage/RHDH
# Scaffolder Template.
#
# parameters below is a hand-translation of template-schema.json's own
# properties into Backstage's RJSF-based form schema -- template-schema.json
# stays the single source of truth for VALUES (both F3's CLI and this
# Template's own fetch:template step read the identical skeleton/ against
# the identical defaults); this file only adds the form/UI layer on top,
# it does not duplicate or re-decide any default value.
#
# owner: matches catalog-info.yaml's own group reference exactly -- no new
# Group entity invented, same sandbox-scope reality (zero User/Group
# entities registered; DEC-092's dangerouslyAllowSignInWithoutUserInCatalog
# note already covers why).
#
# `owner` parameter is a plain string, not Backstage's own OwnerPicker
# ui:field -- OwnerPicker requires selectable Group/User catalog entities
# to exist, and this catalog has none (same reason above). Re-entry point
# if user/group ingestion is ever wanted: the same Keycloak catalog-backend
# plugin PINS.md already names for the sign-in resolver's own equivalent
# gap.
#
# Phase G, Stage 3 (DECISIONS.md DEC-098/DEC-099/DEC-110/DEC-118, G6 Path
# A landing). Real publish:gitea steps replace the old local-render-only
# DoD (DEC-087's own scope decision, superseded here now that the Gitea
# scaffolder dynamic plugin genuinely works -- DEC-118). RepoUrlPicker
# (single source of truth for repoOwner/repoName/gitHost -- no more
# separately hand-entered, un-validated "Repository metadata" fields that
# could drift from what actually gets published) drives two publish
# steps, matching this project's own established two-repo-per-project
# decision (DEC-098/DEC-099, already proven in G6 Path B's tools/
# gitea_publish.py): the GitOps repo (deploy/'s own subtree, sourcePath,
# published FIRST) and the source+pipeline repo (everything else,
# deploy/ removed via fs:delete before this second publish so it isn't
# duplicated into both repos -- order matters here, reversing it would
# either lose deploy/'s content or leak it into the wrong repo).
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-path-agent-scaffolder
  title: Golden Path Agent
  description: >-
    Scaffold a new Agentic AI pilot agent project from the golden-path-agent
    blueprint (LangGraph agent). Phase G, Stage 2 (DEC-098/DEC-099): no
    longer bundles an MCP tool server or an approval service -- those are
    consumed over the network from a separately-scaffolded Tools Template
    instance and the shared Platform Foundation approval service,
    respectively. Phase G, Stage 3 (DEC-118): publishes two real
    repositories to this platform's own Gitea instance -- source+pipeline,
    and a separate GitOps repo -- and registers the result in this
    catalog.
  tags:
    - agentic-ai
    - langgraph
    - mcp
    - golden-path
spec:
  owner: group:default/golden-path-agent-team
  type: service
  parameters:
    - title: Project identity
      required:
        - name
        - owner
      properties:
        name:
          title: Project name
          type: string
          description: >-
            The base identifier for the scaffolded project. Every namespace,
            resource name, OIDC client ID, and OTEL service name in the
            rendered output is derived from this.
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          minLength: 2
          maxLength: 40
        owner:
          title: Owning team
          type: string
          description: >-
            Catalog owner reference for the scaffolded project (e.g.
            'group:default/team-name'). Documentation/attribution only.
        description:
          title: Project description
          type: string
          description: One-sentence description of the scaffolded agent's purpose.
          default: >-
            An agentic AI pilot agent scaffolded from the golden-path-agent
            blueprint.
    - title: Platform connections
      required:
        - mcpEndpoint
        - approvalServiceEndpoint
      properties:
        mcpEndpoint:
          title: MCP tool server endpoint
          type: string
          description: >-
            Base URL of the Tools Template instance this agent consumes.
            No default -- genuinely required, unlike the optional
            repository-metadata fields below.
        mcpApiName:
          title: MCP tool server catalog API name (optional)
          type: string
          description: >-
            The Tools Template instance's own catalog API entity name
            (its 'name' plus '-api', e.g. 'my-tools-api') -- distinct
            from mcpEndpoint, a network address. Lets consumesApis
            resolve once both are live-registered.
          default: REPLACE_ME_mcpApiName
        approvalServiceEndpoint:
          title: Platform approval service endpoint
          type: string
          description: >-
            Base URL of the shared Platform Foundation approval service
            (one singleton for every agent project). No default --
            genuinely required.
        oidcIssuerUrl:
          title: Shared identity realm issuer URL (optional)
          type: string
          description: >-
            Only load-bearing once AGENT_OIDC_MODE is switched from
            "none" to "oidc" -- a placeholder default is safe until then.
          default: REPLACE_ME_oidcIssuerUrl
        modelRoute:
          title: Model route (informational, reserved)
          type: string
          description: >-
            Reserved for G5's catalog model completion -- a catalog-backed
            picker will replace this plain string once model routes are
            registered as catalog entities. Not yet wired to any rendered
            config value.
          default: not-yet-selected
    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          description: >-
            Owner/org and repository name for the new project's
            source+pipeline repo -- the GitOps repo name is derived
            automatically ('<repo>-gitops'), not entered separately.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - golden-path-agent-gitea-golden-path-agent-gitea.apps.cluster-hj7xp.dyn.redhatworkshops.io
  steps:
    - id: fetch-base
      name: Render golden-path-agent skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          mcpEndpoint: ${{ parameters.mcpEndpoint }}
          mcpApiName: ${{ parameters.mcpApiName }}
          approvalServiceEndpoint: ${{ parameters.approvalServiceEndpoint }}
          oidcIssuerUrl: ${{ parameters.oidcIssuerUrl }}
          modelRoute: ${{ parameters.modelRoute }}
          gitHost: ${{ (parameters.repoUrl | parseRepoUrl).host }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
    # DEC-118: GitOps repo published FIRST, from the rendered deploy/
    # subtree only (sourcePath -- the deploy/ prefix itself is dropped at
    # the target repo's own root, matching DEC-111/DEC-112's already-
    # established convention). Must happen before fs:delete below removes
    # deploy/ from the main workspace.
    - id: publish-gitops
      name: Publish GitOps repo to Gitea
      action: publish:gitea
      input:
        repoUrl: ${{ (parameters.repoUrl | parseRepoUrl).host }}?owner=${{ (parameters.repoUrl | parseRepoUrl).owner }}&repo=${{ (parameters.repoUrl | parseRepoUrl).repo }}-gitops
        description: GitOps manifests for ${{ parameters.name }} (kustomize + argocd), published alongside its own source+pipeline repo.
        sourcePath: deploy
        defaultBranch: main
    # Removes deploy/ from the workspace so the source+pipeline publish
    # below doesn't duplicate GitOps content into the wrong repo -- the
    # GitOps repo (above) already has it.
    - id: cleanup-gitops-from-source
      name: Remove deploy/ before publishing the source repo
      action: fs:delete
      input:
        files:
          - deploy
    - id: publish-source
      name: Publish source+pipeline repo to Gitea
      action: publish:gitea
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
    - id: register
      name: Register in the software catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Source+pipeline repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
      - title: GitOps repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
