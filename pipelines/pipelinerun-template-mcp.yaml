# Phase G, G2 (DECISIONS.md DEC-098/DEC-099). Triggers
# golden-path-agent-ci-mcp (pipeline-mcp.yaml).
#   oc create -f pipelines/pipelinerun-template-mcp.yaml -n golden-path-agent-ci
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: golden-path-agent-ci-mcp-
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
    app.kubernetes.io/component: mcp
spec:
  pipelineRef:
    name: golden-path-agent-ci-mcp
  taskRunTemplate:
    serviceAccountName: golden-path-agent-ci-pipeline
  params:
    - name: revision
      value: main
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
