# Phase G, G2 (DEC-098/DEC-099/DEC-101): the agent's own independent
# build/test/promote pipeline, split out of the original single
# golden-path-agent-ci Pipeline (DEC-025). Keeps the full gate set -- none
# of these were ever mcp/approval-specific, so none moved elsewhere.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: golden-path-agent-ci-agent
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
    app.kubernetes.io/component: agent
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/DarkDragonEl/golden-path-agent-template.git
    - name: revision
      type: string
      default: main
    - name: image-repo
      type: string
      default: image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent

  workspaces:
    - name: source

  tasks:
    - name: fetch-source
      taskRef: { name: fetch-source }
      workspaces: [{ name: source, workspace: source }]
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

    - name: unit-tests
      taskRef: { name: unit-tests }
      runAfter: [fetch-source]
      workspaces: [{ name: source, workspace: source }]

    - name: eval-gate-offline
      taskRef: { name: eval-gate-offline }
      runAfter: [fetch-source]
      workspaces: [{ name: source, workspace: source }]

    - name: policy-validate
      taskRef: { name: policy-validate }
      runAfter: [fetch-source]
      workspaces: [{ name: source, workspace: source }]

    - name: journal-census
      taskRef: { name: journal-census }
      runAfter: [fetch-source]
      workspaces: [{ name: source, workspace: source }]

    # Agent-pipeline-only, like policy-validate above: skeleton/ +
    # skeleton-tools/ are the template-instantiation feature, not part of
    # the mcp/approval images (mirrors pipeline-mcp.yaml's own comment on
    # why it excludes agent-reasoning-specific gates). Non-blocking -- see
    # pipelines/tasks/verify-skeleton.yaml for why -- so it is deliberately
    # left out of container-build's runAfter below.
    - name: verify-skeleton
      taskRef: { name: verify-skeleton }
      runAfter: [fetch-source]
      workspaces: [{ name: source, workspace: source }]

    - name: container-build
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: namespace, value: openshift-pipelines }
      runAfter: [unit-tests, eval-gate-offline, policy-validate, journal-census]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: IMAGE
          value: "$(params.image-repo):pr-$(tasks.fetch-source.results.commit-sha)"
        - name: DOCKERFILE
          value: ./Containerfile.agent

    - name: digest-capture
      taskRef: { name: digest-capture }
      runAfter: [container-build]
      params:
        - name: imagestream-tag
          value: "golden-path-agent:pr-$(tasks.fetch-source.results.commit-sha)"

    - name: sbom-generate
      taskRef: { name: sbom-generate }
      runAfter: [digest-capture]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"

    - name: deploy-ephemeral
      taskRef: { name: deploy-ephemeral }
      runAfter: [digest-capture]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: agent-image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"
        # mcp-image-ref / approval-image-ref left at their "" default --
        # ephemeral-test renders with the currently-committed (last
        # independently promoted) mcp/approval digests, per DEC-099.

    - name: eval-gate-live
      taskRef: { name: eval-gate-live }
      runAfter: [deploy-ephemeral]
      workspaces: [{ name: source, workspace: source }]

    - name: security-tests
      taskRef: { name: security-tests }
      runAfter: [deploy-ephemeral]
      workspaces: [{ name: source, workspace: source }]

    - name: operational-tests
      taskRef: { name: operational-tests }
      runAfter: [deploy-ephemeral]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"

    - name: open-promotion-pr
      taskRef: { name: open-promotion-pr }
      runAfter: [eval-gate-live, security-tests, operational-tests, sbom-generate]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"
        - name: commit-sha
          value: "$(tasks.fetch-source.results.commit-sha)"
        - name: image-name
          value: golden-path-agent
        - name: component
          value: agent

  finally:
    - name: destroy-ephemeral
      taskRef: { name: destroy-ephemeral }
      workspaces: [{ name: source, workspace: source }]
