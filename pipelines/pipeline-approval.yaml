# Phase G, G2 (DEC-098/DEC-099/DEC-101): the approval service's own
# independent build/test/promote pipeline. Gate set: full unit-test suite
# + approval-operational-test.yaml's two checks -- a full SRS-APR-IF-01/
# IF-02 round trip is NOT exercised (would need OIDC credentials minted
# for this Task; a named gap, not assumed covered).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: golden-path-agent-ci-approval
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
    app.kubernetes.io/component: approval
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/DarkDragonEl/golden-path-agent-template.git
    - name: revision
      type: string
      default: main
    - name: image-repo
      type: string
      default: image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent-approval

  workspaces:
    - name: source

  tasks:
    - name: fetch-source
      taskRef: { name: fetch-source }
      workspaces: [{ name: source, workspace: source }]
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

    - name: unit-tests
      taskRef: { name: unit-tests }
      runAfter: [fetch-source]
      workspaces: [{ name: source, workspace: source }]

    - name: container-build
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: namespace, value: openshift-pipelines }
      runAfter: [unit-tests]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: IMAGE
          value: "$(params.image-repo):pr-$(tasks.fetch-source.results.commit-sha)"
        - name: DOCKERFILE
          value: ./Containerfile.approval

    - name: digest-capture
      taskRef: { name: digest-capture }
      runAfter: [container-build]
      params:
        - name: imagestream-tag
          value: "golden-path-agent-approval:pr-$(tasks.fetch-source.results.commit-sha)"

    - name: sbom-generate
      taskRef: { name: sbom-generate }
      runAfter: [digest-capture]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"

    - name: deploy-ephemeral
      taskRef: { name: deploy-ephemeral }
      runAfter: [digest-capture]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: approval-image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"
        # agent-image-ref / mcp-image-ref left at their "" default.

    - name: approval-operational-test
      taskRef: { name: approval-operational-test }
      runAfter: [deploy-ephemeral]

    - name: open-promotion-pr
      taskRef: { name: open-promotion-pr }
      runAfter: [approval-operational-test, sbom-generate]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"
        - name: commit-sha
          value: "$(tasks.fetch-source.results.commit-sha)"
        - name: image-name
          value: golden-path-agent-approval
        - name: component
          value: approval

  finally:
    - name: destroy-ephemeral
      taskRef: { name: destroy-ephemeral }
      workspaces: [{ name: source, workspace: source }]
