# Phase C (DEC-023/DEC-024). Least-privilege RBAC for the CI pipeline's
# ServiceAccount: strictly within golden-path-agent-*, no ClusterRole, no
# ClusterRoleBinding, no cluster-admin, ever. Namespace lifecycle itself
# is deliberately not one of its grants -- see namespaces.yaml's header.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: golden-path-agent-ci-pipeline
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
---
# Everything the pipeline's own Task steps need to do inside their own
# namespace: read (never write) the manually-provisioned credentials by
# name, read the ImageStream this project's own buildah step pushes to,
# and read pod/log state for step diagnostics. No Tekton CRD permissions
# here -- the Tekton controller reconciles PipelineRun/TaskRun using its
# own operator-granted permissions, not this ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: golden-path-agent-ci-pipeline-role
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: golden-path-agent-ci-pipeline-rolebinding
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
subjects:
  - kind: ServiceAccount
    name: golden-path-agent-ci-pipeline
    namespace: golden-path-agent-ci
roleRef:
  kind: Role
  name: golden-path-agent-ci-pipeline-role
  apiGroup: rbac.authorization.k8s.io
---
# system:image-builder is a built-in OpenShift ClusterRole (the same one
# BuildConfigs use to push their own output) -- referencing it in a
# namespace-scoped RoleBinding grants imagestreams/imagestreams-layers
# push rights ONLY within golden-path-agent-ci, not cluster-wide. This is
# a RoleBinding, not a ClusterRoleBinding: its effect is confined to this
# one namespace regardless of which ClusterRole it references.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: golden-path-agent-ci-pipeline-image-builder
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
subjects:
  - kind: ServiceAccount
    name: golden-path-agent-ci-pipeline
    namespace: golden-path-agent-ci
roleRef:
  kind: ClusterRole
  name: system:image-builder
  apiGroup: rbac.authorization.k8s.io
---
# DEC-030: pipelines-scc, granted narrowly (resourceNames:[pipelines-scc],
# not a blanket SCC grant) -- plain restricted-v2 cannot run a real
# rootless buildah build (DEC-029/DEC-030's investigation), and this is
# Red Hat's own purpose-built SCC for that, scoped to SETFCAP only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: golden-path-agent-ci-pipeline-scc
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
subjects:
  - kind: ServiceAccount
    name: golden-path-agent-ci-pipeline
    namespace: golden-path-agent-ci
roleRef:
  kind: ClusterRole
  name: pipelines-scc-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
# Everything deploy-ephemeral/destroy-ephemeral need inside
# golden-path-agent-ephemeral-test: full CRUD on exactly the resource
# kinds deploy/kustomize/base actually produces (matching
# deploy/argocd/project.yaml's own namespaceResourceWhitelist), read-only
# on secrets (referenced by name, never created/mutated by the pipeline --
# see the Phase C plan's secret-material handling constraint), and
# pod/log read for smoke checks.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: golden-path-agent-ci-deploy-role
  namespace: golden-path-agent-ephemeral-test
  labels:
    app.kubernetes.io/part-of: golden-path-agent
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
    # DEC-031: missed in the original grant, confirmed live
    # ("cannot get/delete resource ingresses").
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # watch, specifically: `oc rollout status` (deploy-ephemeral.yaml) polls
    # rollout progress via a watch, not just point-in-time get/list.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
    # oc rollout status inspects the Deployment's own ReplicaSet to
    # determine progress -- read-only, this project never manages
    # ReplicaSets directly (that's the Deployment controller's job).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
    # DEC-033: security-tests.yaml/operational-tests.yaml both oc exec
    # into the deployed agent pod -- confirmed live: missing this
    # returned Forbidden on both Tasks.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
    # DEC-045: approval-service's SQLite persistence (pvc-approval.yaml,
    # SRS-APR-DATA-01) is the first PVC this project needs to manage.
---
# Cross-namespace RoleBinding: lives in golden-path-agent-ephemeral-test,
# grants only within this namespace, to a ServiceAccount whose home
# namespace is golden-path-agent-ci. This is the standard, safe pattern
# for "one pipeline identity, permissions in several of this project's own
# namespaces" without ever granting anything cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: golden-path-agent-ci-deploy-rolebinding
  namespace: golden-path-agent-ephemeral-test
  labels:
    app.kubernetes.io/part-of: golden-path-agent
subjects:
  - kind: ServiceAccount
    name: golden-path-agent-ci-pipeline
    namespace: golden-path-agent-ci
roleRef:
  kind: Role
  name: golden-path-agent-ci-deploy-role
  apiGroup: rbac.authorization.k8s.io
---
# DEC-032. Cross-namespace image pull: OpenShift disallows it by
# default, confirmed live (ImagePullBackOff, "authentication required").
# system:image-puller is the standard built-in role for this; lives in
# golden-path-agent-ci (the source namespace granting read access).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: golden-path-agent-image-puller
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
subjects:
  - kind: ServiceAccount
    name: golden-path-agent
    namespace: golden-path-agent-ephemeral-test
  - kind: ServiceAccount
    name: golden-path-agent
    namespace: golden-path-agent-demo-prod
    # DEC-042: a RoleBinding's subject list is scoped per (SA, namespace)
    # pair, so demo-prod needs its own entry, not inherited from
    # ephemeral-test's (DEC-032).
  - kind: ServiceAccount
    name: golden-path-agent-approval
    namespace: golden-path-agent-ephemeral-test
    # DEC-045: approval-service hits the identical cross-namespace pull
    # gap (DEC-032), in both namespaces it's deployed to.
  - kind: ServiceAccount
    name: golden-path-agent-approval
    namespace: golden-path-agent-approval
    # DEC-103: the approval service moved to its own Platform Foundation
    # namespace -- replaces the old demo-prod entry, same cross-namespace
    # pull gap (DEC-032).
  - kind: ServiceAccount
    name: golden-path-agent-mcp
    namespace: golden-path-agent-ephemeral-test
    # DEC-061: the agent/mcp ServiceAccount split -- mcp runs under its
    # own identity, same cross-namespace pull gap.
  - kind: ServiceAccount
    name: golden-path-agent-mcp
    namespace: golden-path-agent-demo-prod
  - kind: ServiceAccount
    name: default
    namespace: golden-path-agent-otel
    # DEC-068: the OTel Collector's traces-http sidecar reuses this
    # project's own image, runs as the namespace default ServiceAccount
    # (no dedicated one for a single sidecar), same pull gap.
roleRef:
  kind: ClusterRole
  name: system:image-puller
  apiGroup: rbac.authorization.k8s.io
