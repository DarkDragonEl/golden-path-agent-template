# Phase C (DEC-023/DEC-024/DEC-021). Applied once, by a human -- the
# pipeline's own ServiceAccount has no cluster-scoped permissions (no
# ClusterRoleBinding, ever), and creating/deleting a Namespace is
# inherently cluster-scoped. "Ephemeral" is preserved at the resource
# level instead: deploy-ephemeral/destroy-ephemeral churn the Deployments/
# Services/ConfigMaps inside this standing namespace, never the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
---
apiVersion: v1
kind: Namespace
metadata:
  name: golden-path-agent-ephemeral-test
  labels:
    app.kubernetes.io/part-of: golden-path-agent
---
apiVersion: v1
kind: Namespace
metadata:
  name: golden-path-agent-demo-prod
  labels:
    app.kubernetes.io/part-of: golden-path-agent
    # DEC-078/DEC-080: ArgoCD's default cluster-wide ClusterRole only
    # grants get/list/watch -- write access needs this label, which
    # triggers the GitOps operator to create a namespace-scoped
    # RoleBinding automatically. golden-path-agent-ephemeral-test does
    # NOT get this label -- pipeline-managed (oc apply), never
    # ArgoCD-synced.
    argocd.argoproj.io/managed-by: openshift-gitops
---
# Phase D (DEC-053/DEC-054). A separate namespace for Keycloak + its own
# Postgres -- rhbk-operator's only supported install modes are
# OwnNamespace/SingleNamespace (PINS.md), and Keycloak is platform
# identity infrastructure, not part of this project's own promoted
# image/environments. Same manual bootstrap discipline as above.
apiVersion: v1
kind: Namespace
metadata:
  name: golden-path-agent-keycloak
  labels:
    app.kubernetes.io/part-of: golden-path-agent
---
# Phase D4 (DEC-068). Platform observability infrastructure, same
# reasoning as golden-path-agent-keycloak's own namespace. No
# NetworkPolicy, deliberately -- mirrors Keycloak's own precedent, both
# being shared platform infra reachable from anywhere in this project.
apiVersion: v1
kind: Namespace
metadata:
  name: golden-path-agent-otel
  labels:
    app.kubernetes.io/part-of: golden-path-agent
---
# Phase F4 (DEC-087/DEC-092/DEC-093). RHDH's namespace -- platform
# dev-tooling, same reasoning as keycloak/-otel above. Unlike those two,
# its Postgres/Backstage CR ARE GitOps-managed, so it needs the same
# write-access label demo-prod's own comment explains (DEC-078/DEC-080).
apiVersion: v1
kind: Namespace
metadata:
  name: golden-path-agent-rhdh
  labels:
    app.kubernetes.io/part-of: golden-path-agent
    argocd.argoproj.io/managed-by: openshift-gitops
---
# Phase G, Stage 1 (DEC-098/DEC-099/DEC-101/DEC-103). The approval
# service's Platform Foundation home, extracted out of demo-prod -- a
# shared singleton, not scoped to one agent project. GitOps-managed,
# needs the same write-access label the namespaces above already explain.
apiVersion: v1
kind: Namespace
metadata:
  name: golden-path-agent-approval
  labels:
    app.kubernetes.io/part-of: golden-path-agent
    argocd.argoproj.io/managed-by: openshift-gitops
