# DEC-147 (M22): demo-prod's external entry point on OpenShift. The base
# Ingress is deliberately platform-neutral and host-less, and OpenShift's
# ingress-to-route controller skips any rule without a host ("Missing
# host field") -- the real reason no Route ever appeared (DEC-139 blamed
# the IngressClass; a class-less Ingress IS managed). A host-less native
# Route instead: OpenShift assigns <name>-<namespace>.<apps domain>, so no
# hostname is committed. Applied by scripts/bootstrap.sh step 2, not
# ArgoCD (the AppProject whitelists no Route, and ArgoCD never prunes an
# object it doesn't track). step 9's E2E probe reads it by name.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: golden-path-agent
  namespace: golden-path-agent-demo-prod
  labels:
    app.kubernetes.io/part-of: golden-path-agent
    backstage.io/kubernetes-id: golden-path-agent # DEC-141: Topology's Route decorator
spec:
  to:
    kind: Service
    name: golden-path-agent
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
