# Phase G, G2 (DECISIONS.md DEC-098/DEC-099): the MCP tool server's own
# independent build/test/promote pipeline -- Layer-1/Tools-Template
# proof-of-independence in miniature, ahead of G3's actual separate
# template. Gate set: the full unit-test suite (still valuable -- a
# schema/store change here can break agent-side contracts pytest already
# covers) plus mcp-operational-test.yaml's own two checks against the
# freshly-deployed pod. eval-gate-*/policy-validate/operational-tests
# (agent-reasoning- and model-fallback-specific) do not apply here and
# stay agent-pipeline-only.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: golden-path-agent-ci-mcp
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
    app.kubernetes.io/component: mcp
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/DarkDragonEl/golden-path-agent-template.git
    - name: revision
      type: string
      default: main
    - name: image-repo
      type: string
      default: image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent-mcp

  workspaces:
    - name: source

  tasks:
    - name: fetch-source
      taskRef: { name: fetch-source }
      workspaces: [{ name: source, workspace: source }]
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

    - name: unit-tests
      taskRef: { name: unit-tests }
      runAfter: [fetch-source]
      workspaces: [{ name: source, workspace: source }]

    - name: container-build
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: namespace, value: openshift-pipelines }
      runAfter: [unit-tests]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: IMAGE
          value: "$(params.image-repo):pr-$(tasks.fetch-source.results.commit-sha)"
        - name: DOCKERFILE
          value: ./Containerfile.mcp

    - name: digest-capture
      taskRef: { name: digest-capture }
      runAfter: [container-build]
      params:
        - name: imagestream-tag
          value: "golden-path-agent-mcp:pr-$(tasks.fetch-source.results.commit-sha)"

    - name: sbom-generate
      taskRef: { name: sbom-generate }
      runAfter: [digest-capture]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"

    - name: deploy-ephemeral
      taskRef: { name: deploy-ephemeral }
      runAfter: [digest-capture]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: mcp-image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"
        # agent-image-ref / approval-image-ref left at their "" default.

    - name: mcp-operational-test
      taskRef: { name: mcp-operational-test }
      runAfter: [deploy-ephemeral]

    - name: open-promotion-pr
      taskRef: { name: open-promotion-pr }
      runAfter: [mcp-operational-test, sbom-generate]
      workspaces: [{ name: source, workspace: source }]
      params:
        - name: image-ref
          value: "$(params.image-repo)@$(tasks.digest-capture.results.digest)"
        - name: commit-sha
          value: "$(tasks.fetch-source.results.commit-sha)"
        - name: image-name
          value: golden-path-agent-mcp
        - name: component
          value: mcp

  finally:
    - name: destroy-ephemeral
      taskRef: { name: destroy-ephemeral }
      workspaces: [{ name: source, workspace: source }]
