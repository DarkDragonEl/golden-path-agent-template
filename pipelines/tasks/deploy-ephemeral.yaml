# ADR-008. Applies deploy/kustomize/overlays/
# ephemeral-test with a pipeline-scoped digest override -- `kustomize
# edit set image` runs against base/kustomization.yaml, in this scratch
# checkout only, never committed: base+overlay both declaring an
# `images:` transformer for the same name is a documented upstream
# kustomize limitation (kubernetes-sigs/kustomize#1040/#4581) where the
# overlay's override doesn't reliably take effect. Namespace itself is
# pre-created (namespaces.yaml, ADR-018) -- this Task never touches it.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-ephemeral
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  params:
    # ADR-011: a PipelineRun under test exercises ONE
    # fresh, just-built component against the other two's currently-
    # committed digests. An empty value here means "leave this image
    # entry untouched."
    - name: agent-image-ref
      type: string
      default: ""
      description: Full pushed agent image reference including digest, or "" to leave the committed digest untouched.
    - name: mcp-image-ref
      type: string
      default: ""
      description: Full pushed mcp image reference including digest, or "" to leave the committed digest untouched.
    - name: approval-image-ref
      type: string
      default: ""
      description: Full pushed approval image reference including digest, or "" to leave the committed digest untouched.
  workspaces:
    - name: source
  steps:
    - name: render-with-digest-override
      image: registry.k8s.io/kustomize/kustomize:v5.8.1
      workingDir: $(workspaces.source.path)/deploy/kustomize/overlays/ephemeral-test
      env:
        # The overlay's committed configMapGenerator literal is a
        # deliberate placeholder (this repo is public) -- overridden at
        # apply-time from golden-path-agent-ci-config, never in Git.
        - name: MODEL_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: golden-path-agent-ci-config
              key: MODEL_API_BASE_URL
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: golden-path-agent-ci-config
              key: MODEL_NAME
        # Same placeholder-override reasoning as MODEL_API_BASE_URL
        # above -- mirrors the local-dev fallback pair pattern (ADR-006).
        - name: MODEL_FALLBACK_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: golden-path-agent-ci-config
              key: MODEL_FALLBACK_API_BASE_URL
        - name: MODEL_FALLBACK_NAME
          valueFrom:
            configMapKeyRef:
              name: golden-path-agent-ci-config
              key: MODEL_FALLBACK_NAME
      script: |
        #!/bin/sh
        set -eu
        cd $(workspaces.source.path)/deploy/kustomize/base
        # Only the component(s) actually under test in this PipelineRun
        # get a digest override -- the others keep whatever is currently
        # committed (last independently promoted).
        [ -n "$(params.agent-image-ref)" ] && \
          kustomize edit set image golden-path-agent="$(params.agent-image-ref)"
        [ -n "$(params.mcp-image-ref)" ] && \
          kustomize edit set image golden-path-agent-mcp="$(params.mcp-image-ref)"
        [ -n "$(params.approval-image-ref)" ] && \
          kustomize edit set image golden-path-agent-approval="$(params.approval-image-ref)"
        cd $(workspaces.source.path)/deploy/kustomize/overlays/ephemeral-test
        kustomize edit set configmap golden-path-agent-config \
          --from-literal=MODEL_API_BASE_URL="${MODEL_API_BASE_URL}" \
          --from-literal=MODEL_NAME="${MODEL_NAME}" \
          --from-literal=MODEL_FALLBACK_API_BASE_URL="${MODEL_FALLBACK_API_BASE_URL}" \
          --from-literal=MODEL_FALLBACK_NAME="${MODEL_FALLBACK_NAME}"
        kustomize build . > $(workspaces.source.path)/rendered-ephemeral.yaml
        # `kustomize edit set image` rewrites the whole file in
        # place -- revert it now (render already captured above) since
        # open-promotion-pr later sed-patches the ORIGINAL committed file
        # from this same shared workspace PVC.
        git -C $(workspaces.source.path) checkout -- deploy/kustomize/base/kustomization.yaml
    - name: apply
      image: quay.io/openshift/origin-cli:4.20
      script: |
        #!/bin/sh
        set -eu
        oc apply -n golden-path-agent-ephemeral-test -f $(workspaces.source.path)/rendered-ephemeral.yaml
        oc rollout status deployment/golden-path-agent -n golden-path-agent-ephemeral-test --timeout=180s
        oc rollout status deployment/golden-path-agent-mcp -n golden-path-agent-ephemeral-test --timeout=180s
        # approval-service is now part of this same rendered
        # manifest set (ephemeral-test only, per ADR-008) -- gate on its
        # rollout the same way, not just applied-and-hoped.
        oc rollout status deployment/golden-path-agent-approval -n golden-path-agent-ephemeral-test --timeout=180s
