# Phase C, Step C1b. SysR-P-PKG-02 -- an SBOM generated at build time,
# associated with the image digest.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sbom-generate
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  params:
    - name: image
      type: string
      description: Full image reference including digest, e.g. <registry>/<repo>@sha256:...
  workspaces:
    - name: source
  volumes:
    # DEC-027: syft hardcodes some /tmp usage regardless of $HOME/
    # $XDG_CACHE_HOME, and the image's own /tmp isn't writable under an
    # arbitrary non-root UID (confirmed live) -- an emptyDir at /tmp fixes it.
    - name: syft-tmp
      emptyDir: {}
  steps:
    - name: build-registry-auth
      # syft is a standalone tool, not a kubelet image pull -- it needs an
      # actual docker-config credential to read from the internal
      # registry, not just K8s RBAC on this ServiceAccount. OpenShift's
      # internal registry accepts the pod's own mounted SA token as that
      # credential (the same mechanism `oc registry login` automates).
      image: docker.io/library/python:3.12-slim
      volumeMounts:
        - name: syft-tmp
          mountPath: /tmp
      script: |
        #!/bin/sh
        set -eu
        mkdir -p /tmp/.docker
        python3 -c "
        import base64, json
        token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read().strip()
        auth = base64.b64encode(f'serviceaccount:{token}'.encode()).decode()
        json.dump({'auths': {'image-registry.openshift-image-registry.svc:5000': {'auth': auth}}},
                  open('/tmp/.docker/config.json', 'w'))
        "
    - name: syft
      image: docker.io/anchore/syft:v1.51.0
      workingDir: $(workspaces.source.path)
      env:
        # HOME=/tmp so syft's own docker-credential resolution finds the
        # config.json the previous step wrote to /tmp/.docker/ -- both
        # steps mount the same emptyDir at /tmp, so this is really one
        # shared, writable directory across the two containers.
        - name: HOME
          value: /tmp
      volumeMounts:
        - name: syft-tmp
          mountPath: /tmp
      command: ["/syft"]
      args:
        - "$(params.image)"
        - "-o"
        - "spdx-json=sbom.json"
