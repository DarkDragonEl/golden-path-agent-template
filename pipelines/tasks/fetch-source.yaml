# Phase C (DEC-025). Minimal, self-contained git-clone -- PINS.md's
# "git-clone" row explains why (not the deprecated Tekton Hub Task).
# `git init`+`fetch`+`checkout` instead of `clone`, DEC-080/DEC-081:
# `clone` refuses a non-empty dir, and this cluster's storage class
# always creates a `lost+found` in a fresh PV -- same result, no check.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-source
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  results:
    - name: commit-sha
      description: The resolved commit SHA actually checked out.
  steps:
    - name: clone
      image: docker.io/alpine/git:2.54.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        git init -q .
        git remote add origin "$(params.repo-url)"
        git fetch --depth 1 origin "$(params.revision)"
        git checkout -q FETCH_HEAD
        git rev-parse HEAD | tr -d '\n' > "$(results.commit-sha.path)"
