# SysR-P-F-05(4): a live kill-primary fallback
# trigger, mirroring ADR-006's manual demo, automated against the real
# cluster. Checks fallback behavior functionally, not via an exported
# OTel trace (the cluster-tier Collector isn't wired into ephemeral-test
# yet -- a named, tracked gap, ADR-018).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: operational-tests
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  params:
    - name: image-ref
      type: string
      description: Full pushed image reference including digest.
  workspaces:
    - name: source
  steps:
    - name: kill-primary-fallback-check
      image: quay.io/openshift/origin-cli:4.20
      script: |
        #!/bin/sh
        set -eu
        NS=golden-path-agent-ephemeral-test
        NAME=golden-path-agent-fallback-demo

        # Throwaway Deployment, separate from the standing one -- broken
        # primary, correct fallback. Labels: MERGE into the source
        # Deployment's own rendered labels (never replace wholesale, which
        # silently drops kustomize's commonLabels-injected keys the
        # NetworkPolicy selector needs). component=agent-fallback-demo,
        # deliberately NOT component=agent -- avoids ReplicaSet adoption
        # by the standing agent Deployment's own selector (ADR-011).
        oc get deployment golden-path-agent -n "$NS" -o json \
          | python3 -c "
        import json, sys
        d = json.load(sys.stdin)
        # Merge into the existing (already commonLabels-rendered) label
        # dicts rather than replacing them wholesale -- a full replacement
        # silently drops whatever else kustomize's commonLabels injected
        # (e.g. app.kubernetes.io/part-of), which the rendered NetworkPolicy
        # selector also requires. Merging stays correct even if commonLabels
        # gains more keys later.
        labels = dict(d['metadata'].get('labels') or {})
        labels['app.kubernetes.io/component'] = 'agent-fallback-demo'
        d['metadata'] = {'name': '$NAME', 'namespace': '$NS', 'labels': labels}
        spec = d['spec']
        spec['selector'] = {'matchLabels': {'app.kubernetes.io/instance': '$NAME'}}
        tmpl_labels = dict(spec['template']['metadata'].get('labels') or {})
        tmpl_labels['app.kubernetes.io/component'] = 'agent-fallback-demo'
        tmpl_labels['app.kubernetes.io/instance'] = '$NAME'
        spec['template']['metadata']['labels'] = tmpl_labels
        for c in spec['template']['spec']['containers']:
            c['env'] = (c.get('env') or []) + [{'name': 'MODEL_API_BASE_URL', 'value': 'https://model-endpoint.invalid/v1'}]
        json.dump(d, sys.stdout)
        " | oc apply -n "$NS" -f -

        oc rollout status deployment/"$NAME" -n "$NS" --timeout=180s
        POD=$(oc get pod -n "$NS" -l app.kubernetes.io/instance="$NAME" -o jsonpath='{.items[0].metadata.name}')

        # ADR-019: python3/urllib inside the pod via stdin, not curl --
        # same reason as security-tests.yaml's own fix (the agent's own
        # image has no curl at all, confirmed live).
        oc exec -i -n "$NS" "$POD" -- python3 - <<'PYEOF' > /tmp/resp.json
        import json
        import sys
        import urllib.request

        data = json.dumps(
            {
                "query": "What is the status of incident INC-10240?",
                "write": False,
                "user_id": "ci-operational-test",
            }
        ).encode()
        req = urllib.request.Request(
            "http://localhost:8080/invoke",
            data=data,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=30) as r:
            resp = json.load(r)
        json.dump(resp, sys.stdout)
        PYEOF
        cat /tmp/resp.json

        oc delete deployment "$NAME" -n "$NS" --wait=false

        final_output=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('final_output') or '')")
        [ -n "$final_output" ] || { echo "FAIL: no final_output -- fallback did not recover the request." >&2; exit 1; }
        echo "$final_output" | grep -qi "could not be completed safely" && {
          echo "FAIL: request escalated to human review instead of falling back -- fallback route may not be configured." >&2
          exit 1
        }
        echo "OK: call succeeded with primary deliberately broken -- fallback route absorbed the failure."

    - name: kill-mcp-connectivity-check
      runAfter: [kill-primary-fallback-check]
      image: quay.io/openshift/origin-cli:4.20
      script: |
        #!/bin/sh
        set -eu
        NS=golden-path-agent-ephemeral-test
        NAME=golden-path-agent-mcp-unreachable-demo

        # ADR-014's own network-fault complement, proven live here: a
        # genuine network fault (unreachable DNS, real connection
        # failure), not simulated -- same isolated throwaway-clone +
        # merge-not-replace label pattern as kill-primary-fallback-check
        # above (ADR-011), never touching the standing deployment other
        # stages still depend on.
        oc get deployment golden-path-agent -n "$NS" -o json \
          | python3 -c "
        import json, sys
        d = json.load(sys.stdin)
        labels = dict(d['metadata'].get('labels') or {})
        labels['app.kubernetes.io/component'] = 'agent-mcp-unreachable-demo'
        d['metadata'] = {'name': '$NAME', 'namespace': '$NS', 'labels': labels}
        spec = d['spec']
        spec['selector'] = {'matchLabels': {'app.kubernetes.io/instance': '$NAME'}}
        tmpl_labels = dict(spec['template']['metadata'].get('labels') or {})
        tmpl_labels['app.kubernetes.io/component'] = 'agent-mcp-unreachable-demo'
        tmpl_labels['app.kubernetes.io/instance'] = '$NAME'
        spec['template']['metadata']['labels'] = tmpl_labels
        for c in spec['template']['spec']['containers']:
            c['env'] = (c.get('env') or []) + [{'name': 'MCP_TOOL_ENDPOINT', 'value': 'http://mcp-endpoint.invalid:8081'}]
        json.dump(d, sys.stdout)
        " | oc apply -n "$NS" -f -

        oc rollout status deployment/"$NAME" -n "$NS" --timeout=180s
        POD=$(oc get pod -n "$NS" -l app.kubernetes.io/instance="$NAME" -o jsonpath='{.items[0].metadata.name}')

        oc exec -i -n "$NS" "$POD" -- python3 - <<'PYEOF' > /tmp/mcp_fault_resp.json
        import json
        import sys
        import time
        import urllib.request

        data = json.dumps(
            {
                "query": "What is the status of incident INC-10240?",
                "write": False,
                "user_id": "ci-mcp-fault-test",
            }
        ).encode()
        req = urllib.request.Request(
            "http://localhost:8080/invoke",
            data=data,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        start = time.monotonic()
        with urllib.request.urlopen(req, timeout=60) as r:
            resp = json.load(r)
        resp["_elapsed_seconds"] = time.monotonic() - start
        json.dump(resp, sys.stdout)
        PYEOF
        cat /tmp/mcp_fault_resp.json

        oc delete deployment "$NAME" -n "$NS" --wait=false

        # Bounded, not hung: TOOL_TIMEOUT_SECONDS=10 (base configmap.yaml)
        # plus generous margin for the request/response round trip itself
        # -- a real regression (e.g. an unbounded network call somewhere
        # in the chain) would show up here as a request that takes far
        # longer than the tool's own configured timeout, not as an
        # outright hang this script would otherwise need its own separate
        # watchdog to catch.
        python3 -c "
        import json, sys
        resp = json.load(open('/tmp/mcp_fault_resp.json'))
        elapsed = resp.get('_elapsed_seconds', 0)
        final_output = resp.get('final_output') or ''
        fallback_reason = resp.get('fallback_reason') or ''
        assert elapsed < 30, f'FAIL: took {elapsed:.1f}s -- expected a bounded tool-timeout failure well under 30s, not a hang'
        assert 'could not be completed safely' in final_output.lower(), f'FAIL: expected a graceful escalation message, got: {final_output!r}'
        assert fallback_reason.startswith('tool_error:'), f'FAIL: expected fallback_reason to attribute this to a tool error, got: {fallback_reason!r}'
        print(f'OK: MCP unreachable -> graceful tool_error escalation in {elapsed:.1f}s, no hang, no crash.')
        "
