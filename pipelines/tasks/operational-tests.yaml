# Phase C, Step C1b. SysR-P-F-05(4) operational tests: a live kill-primary
# fallback trigger, mirroring the demo DEC-020 already ran manually and
# locally (this session's own Checkpoint B2 exit verification) -- now
# automated against the real cluster.
#
# Scope note: this checks fallback *behavior* (the call still succeeds
# despite a broken primary route) functionally, not via an exported OTel
# trace -- the cluster-tier OTel Collector Operator (PINS.md: pinned,
# available in-cluster, not yet installed) isn't wired into this
# ephemeral deployment yet. That's a real, separately-tracked gap, not a
# silent scope cut -- see the Phase C report/DEC-025 for the explicit
# note on what's deferred and why.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: operational-tests
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  params:
    - name: image-ref
      type: string
      description: Full pushed image reference including digest.
  workspaces:
    - name: source
  steps:
    - name: kill-primary-fallback-check
      image: quay.io/openshift/origin-cli:4.20
      script: |
        #!/bin/sh
        set -eu
        NS=golden-path-agent-ephemeral-test
        NAME=golden-path-agent-fallback-demo

        # Throwaway Deployment, separate from the standing ephemeral-test
        # Deployment other stages depend on -- deliberately broken primary,
        # correct fallback (from the same real secret/config the standing
        # deployment uses).
        # DEC-098/DEC-099 (G2): real gap found live, fixed here -- flipping
        # ephemeral-test's MCP_MODE to live (required by the split agent
        # image) turned this clone's tool call into a genuine network
        # request for the first time ever. It then hung until timeout, in
        # two rounds: (1) this clone's labels used to fully replace
        # app.kubernetes.io/name and app.kubernetes.io/component (dropping
        # both) -- silently irrelevant under MCP_MODE=mock (no network call
        # ever made), a real, blocking bug now that one is; (2) the first
        # fix's own hardcoded label set still didn't merge, so it also
        # dropped app.kubernetes.io/part-of -- injected into every rendered
        # resource, including this NetworkPolicy's own ingress selector, by
        # kustomize's commonLabels transformer, not visible in the raw
        # source file. Fix (both rounds, now merge-based so it stays
        # correct if commonLabels gains more keys later): keep the source
        # Deployment's own rendered labels and only override component to a
        # distinct value (agent-fallback-demo) -- deliberately NOT
        # component=agent, which would make this pod a subset-match for
        # the standing agent Deployment's own selector and risk its
        # ReplicaSet adopting this throwaway pod as one of its own.
        # golden-path-agent-mcp-restrict gets a second, narrowly-scoped
        # ingress rule (deploy/kustomize/base/networkpolicy.yaml) allowing
        # exactly this component value, nothing broader.
        oc get deployment golden-path-agent -n "$NS" -o json \
          | python3 -c "
        import json, sys
        d = json.load(sys.stdin)
        # Merge into the existing (already commonLabels-rendered) label
        # dicts rather than replacing them wholesale -- a full replacement
        # silently drops whatever else kustomize's commonLabels injected
        # (e.g. app.kubernetes.io/part-of), which the rendered NetworkPolicy
        # selector also requires. Merging stays correct even if commonLabels
        # gains more keys later.
        labels = dict(d['metadata'].get('labels') or {})
        labels['app.kubernetes.io/component'] = 'agent-fallback-demo'
        d['metadata'] = {'name': '$NAME', 'namespace': '$NS', 'labels': labels}
        spec = d['spec']
        spec['selector'] = {'matchLabels': {'app.kubernetes.io/instance': '$NAME'}}
        tmpl_labels = dict(spec['template']['metadata'].get('labels') or {})
        tmpl_labels['app.kubernetes.io/component'] = 'agent-fallback-demo'
        tmpl_labels['app.kubernetes.io/instance'] = '$NAME'
        spec['template']['metadata']['labels'] = tmpl_labels
        for c in spec['template']['spec']['containers']:
            c['env'] = (c.get('env') or []) + [{'name': 'MODEL_API_BASE_URL', 'value': 'https://model-endpoint.invalid/v1'}]
        json.dump(d, sys.stdout)
        " | oc apply -n "$NS" -f -

        oc rollout status deployment/"$NAME" -n "$NS" --timeout=180s
        POD=$(oc get pod -n "$NS" -l app.kubernetes.io/instance="$NAME" -o jsonpath='{.items[0].metadata.name}')

        # DEC-034: python3/urllib inside the pod via stdin, not curl --
        # same reason as security-tests.yaml's own fix (the agent's own
        # image has no curl at all, confirmed live).
        oc exec -i -n "$NS" "$POD" -- python3 - <<'PYEOF' > /tmp/resp.json
        import json
        import sys
        import urllib.request

        data = json.dumps(
            {
                "query": "What is the status of incident INC-10240?",
                "write": False,
                "user_id": "ci-operational-test",
            }
        ).encode()
        req = urllib.request.Request(
            "http://localhost:8080/invoke",
            data=data,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=30) as r:
            resp = json.load(r)
        json.dump(resp, sys.stdout)
        PYEOF
        cat /tmp/resp.json

        oc delete deployment "$NAME" -n "$NS" --wait=false

        final_output=$(python3 -c "import json; print(json.load(open('/tmp/resp.json')).get('final_output') or '')")
        [ -n "$final_output" ] || { echo "FAIL: no final_output -- fallback did not recover the request." >&2; exit 1; }
        echo "$final_output" | grep -qi "could not be completed safely" && {
          echo "FAIL: request escalated to human review instead of falling back -- fallback route may not be configured." >&2
          exit 1
        }
        echo "OK: call succeeded with primary deliberately broken -- fallback route absorbed the failure."

    - name: kill-mcp-connectivity-check
      runAfter: [kill-primary-fallback-check]
      image: quay.io/openshift/origin-cli:4.20
      script: |
        #!/bin/sh
        set -eu
        NS=golden-path-agent-ephemeral-test
        NAME=golden-path-agent-mcp-unreachable-demo

        # Phase G, Stage 2 (DEC-098/DEC-099/DEC-104/DEC-105): the
        # complement DEC-105 requires -- domain eval's own fault
        # injection moved to an in-process, eval-only fixture (never
        # touching the real, deployed MCP server), so the network-level
        # fidelity that gives up must be proven honestly here instead,
        # against the real split architecture. This is a genuine network
        # fault (an unreachable DNS name, real connection failure), not a
        # simulated one -- MCP_TOOL_ENDPOINT is the one env var overridden
        # (mirrors kill-primary-fallback-check's own MODEL_API_BASE_URL
        # override above, same throwaway-clone pattern, same
        # merge-not-replace label fix already proven correct there and in
        # DEC-101) rather than a live NetworkPolicy edit or killing the
        # standing mcp pod -- both would affect the standing deployment
        # other stages in this same PipelineRun still depend on; this
        # clone is fully isolated and self-cleans.
        oc get deployment golden-path-agent -n "$NS" -o json \
          | python3 -c "
        import json, sys
        d = json.load(sys.stdin)
        labels = dict(d['metadata'].get('labels') or {})
        labels['app.kubernetes.io/component'] = 'agent-mcp-unreachable-demo'
        d['metadata'] = {'name': '$NAME', 'namespace': '$NS', 'labels': labels}
        spec = d['spec']
        spec['selector'] = {'matchLabels': {'app.kubernetes.io/instance': '$NAME'}}
        tmpl_labels = dict(spec['template']['metadata'].get('labels') or {})
        tmpl_labels['app.kubernetes.io/component'] = 'agent-mcp-unreachable-demo'
        tmpl_labels['app.kubernetes.io/instance'] = '$NAME'
        spec['template']['metadata']['labels'] = tmpl_labels
        for c in spec['template']['spec']['containers']:
            c['env'] = (c.get('env') or []) + [{'name': 'MCP_TOOL_ENDPOINT', 'value': 'http://mcp-endpoint.invalid:8081'}]
        json.dump(d, sys.stdout)
        " | oc apply -n "$NS" -f -

        oc rollout status deployment/"$NAME" -n "$NS" --timeout=180s
        POD=$(oc get pod -n "$NS" -l app.kubernetes.io/instance="$NAME" -o jsonpath='{.items[0].metadata.name}')

        oc exec -i -n "$NS" "$POD" -- python3 - <<'PYEOF' > /tmp/mcp_fault_resp.json
        import json
        import sys
        import time
        import urllib.request

        data = json.dumps(
            {
                "query": "What is the status of incident INC-10240?",
                "write": False,
                "user_id": "ci-mcp-fault-test",
            }
        ).encode()
        req = urllib.request.Request(
            "http://localhost:8080/invoke",
            data=data,
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        start = time.monotonic()
        with urllib.request.urlopen(req, timeout=60) as r:
            resp = json.load(r)
        resp["_elapsed_seconds"] = time.monotonic() - start
        json.dump(resp, sys.stdout)
        PYEOF
        cat /tmp/mcp_fault_resp.json

        oc delete deployment "$NAME" -n "$NS" --wait=false

        # Bounded, not hung: TOOL_TIMEOUT_SECONDS=10 (base configmap.yaml)
        # plus generous margin for the request/response round trip itself
        # -- a real regression (e.g. an unbounded network call somewhere
        # in the chain) would show up here as a request that takes far
        # longer than the tool's own configured timeout, not as an
        # outright hang this script would otherwise need its own separate
        # watchdog to catch.
        python3 -c "
        import json, sys
        resp = json.load(open('/tmp/mcp_fault_resp.json'))
        elapsed = resp.get('_elapsed_seconds', 0)
        final_output = resp.get('final_output') or ''
        fallback_reason = resp.get('fallback_reason') or ''
        assert elapsed < 30, f'FAIL: took {elapsed:.1f}s -- expected a bounded tool-timeout failure well under 30s, not a hang'
        assert 'could not be completed safely' in final_output.lower(), f'FAIL: expected a graceful escalation message, got: {final_output!r}'
        assert fallback_reason.startswith('tool_error:'), f'FAIL: expected fallback_reason to attribute this to a tool error, got: {fallback_reason!r}'
        print(f'OK: MCP unreachable -> graceful tool_error escalation in {elapsed:.1f}s, no hang, no crash.')
        "
