# Phase C, Step C1b. SysR-P-F-05(1) software tests. Same command a
# developer runs locally (make test / pytest -q) -- no CI-specific
# reinterpretation of what "tests pass" means.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-tests
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  workspaces:
    - name: source
  steps:
    - name: pytest
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q -r requirements.txt -r requirements-dev.txt
        pytest -q
