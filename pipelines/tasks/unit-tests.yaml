# Phase C, Step C1b/C1c (DECISIONS.md DEC-027). SysR-P-F-05(1) software
# tests. Same command a developer runs locally (make test / pytest -q) --
# no CI-specific reinterpretation of what "tests pass" means.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: unit-tests
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  workspaces:
    - name: source
  steps:
    - name: pytest
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        # DEC-027: under this project's own restricted-v2-SCC ServiceAccount
        # (no anyuid grant, deliberately), the container runs as an
        # arbitrary non-root UID with no /etc/passwd entry -- $HOME
        # defaults to "/", which pip's --user install target then can't
        # write to ("Permission denied: '/.local'", confirmed live, first
        # C1c run). /tmp is used deliberately over the originally-tried
        # /tekton/home: /tmp is guaranteed world-writable by plain
        # container/OS convention regardless of arbitrary UID, verified
        # locally (podman, simulated non-root UID) before trusting it on a
        # third cluster run -- /tekton/home's writability under this
        # specific Tekton/SCC combination was an unverified assumption the
        # first fix attempt would have carried forward untested.
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q -r requirements.txt -r requirements-dev.txt
        pytest -q
