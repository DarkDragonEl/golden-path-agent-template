# Phase C, Step C1b. SysR-P-F-05(2) agent tests. Re-runs the existing,
# unmodified eval.cli --domain harness in-process (AGENT_MODEL_MODE=live,
# DEC-017's temperature=0/seed=42 contract; MCP_MODE=mock) -- tests real
# reasoning quality against the real model, not the deployed pods'
# HTTP surface (security-tests/operational-tests cover that).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eval-gate-live
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  workspaces:
    - name: source
  steps:
    - name: eval-domain
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: AGENT_MODEL_MODE
          value: live
        - name: MCP_MODE
          value: mock
        - name: MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: golden-path-agent-secrets
              key: MODEL_API_KEY
        - name: MODEL_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: golden-path-agent-ci-config
              key: MODEL_API_BASE_URL
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: golden-path-agent-ci-config
              key: MODEL_NAME
        # DEC-027: pip install needs a writable $HOME under this project's
        # restricted-v2-SCC identity -- see unit-tests.yaml's fuller note.
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q -r requirements.txt -r requirements-dev.txt
        # DEC-022: an unexpected failure here on a PR that doesn't touch
        # the measurement instrument isn't automatically the change's
        # fault -- see docs/phase-c-runbook.md §4 before calling it a
        # regression.
        python -m eval.cli run --domain
