# Phase C (DEC-025/DEC-043/DEC-044). SysR-P-F-11 -- three checks, kept
# as separate steps since opa/python don't share one image:
#   1. opa test policy/opa/ -- the rego's own fail-closed deny path.
#   2. tools/check_policy_sync.py -- approval_rules.yaml vs. its rego
#      mirror haven't drifted (DEC-023).
#   3. tools/check_config_contract.py -- the DEC-035/DEC-042 missing-key/
#      unresolved-placeholder pattern, enforced.
# None is a live enforcement point -- agent/policy.py stays the sole
# Policy Decision Point at request time.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: policy-validate
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  workspaces:
    - name: source
  steps:
    - name: opa-test
      image: docker.io/openpolicyagent/opa:1.19.1
      workingDir: $(workspaces.source.path)
      command: ["opa"]
      args: ["test", "policy/opa/", "-v"]

    - name: opa-dump-rego-data
      # -debug variant specifically: the plain 1.19.1 image has no shell at
      # all (verified live -- "sh: not found"), which script: requires.
      # -debug is the same OPA binary with a busybox shell added for
      # exactly this kind of use.
      image: docker.io/openpolicyagent/opa:1.19.1-debug
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        opa eval -d policy/opa -f json 'data.golden_path.approval.tool_classification' \
          > /tmp/tool_classification.json
        opa eval -d policy/opa -f json 'data.golden_path.approval.default_classification' \
          > /tmp/default_classification.json
        cp /tmp/tool_classification.json /tmp/default_classification.json $(workspaces.source.path)/

    - name: policy-sync-check
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        # DEC-027: pip install needs a writable $HOME under this project's
        # restricted-v2-SCC identity -- see unit-tests.yaml's fuller note.
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q pyyaml
        python tools/check_policy_sync.py \
          --rego-classification-file tool_classification.json \
          --rego-default-file default_classification.json
        rm -f tool_classification.json default_classification.json

    - name: config-contract-check
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q pyyaml
        python tools/check_config_contract.py
