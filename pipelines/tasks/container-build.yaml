# Phase C, Step C1b. SysR-P-F-05/F-06 -- build exactly one OCI image per
# change set, pushed to this project's own ImageStream in
# golden-path-agent-ci (never Quay -- PINS.md's registry row). The
# ServiceAccount running this step (golden-path-agent-ci-pipeline) has
# registry push rights via the built-in system:image-builder ClusterRole,
# bound namespace-scoped (pipelines/bootstrap/rbac.yaml) -- nothing here
# needs its own registry credential.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: container-build
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  params:
    - name: image
      type: string
      description: Full push target, e.g. image-registry.openshift-image-registry.svc:5000/golden-path-agent-ci/golden-path-agent:<tag>
  workspaces:
    - name: source
  volumes:
    # OpenShift auto-injects this ConfigMap into every namespace (zero
    # setup on this project's part) -- the CA that signs the internal
    # registry's serving cert, so buildah's push can verify TLS properly
    # instead of --tls-verify=false.
    - name: service-ca
      configMap:
        name: openshift-service-ca.crt
  steps:
    - name: buildah-build-and-push
      image: quay.io/buildah/stable:v1.43.2
      workingDir: $(workspaces.source.path)
      # DECISIONS.md DEC-029: no added capabilities. A speculative
      # `capabilities.add: [SETFCAP]` here (added without verification,
      # on the untested assumption buildah might need it) blocked pod
      # admission outright under this project's own restricted-v2 SCC
      # (confirmed live: "capability may not be added" -- restricted-v2
      # permits zero added capabilities, full stop, not just SETFCAP).
      # This project's own Containerfile is a plain pip-install/COPY
      # build, already explicitly written to be restricted-SCC-compatible
      # (its own comment: "arbitrary non-root UID, group-writable, GID
      # 0") -- buildah's rootless --storage-driver=vfs mode needs no
      # elevated capability to build it, confirmed by removing the
      # speculative grant rather than working around the admission
      # rejection some other way.
      volumeMounts:
        - name: service-ca
          mountPath: /var/run/configs/openshift-service-ca
          readOnly: true
      script: |
        #!/bin/sh
        set -eu
        buildah bud --storage-driver=vfs -t "$(params.image)" -f Containerfile .
        buildah push --storage-driver=vfs \
          --cert-dir=/var/run/configs/openshift-service-ca \
          "$(params.image)" "docker://$(params.image)"
