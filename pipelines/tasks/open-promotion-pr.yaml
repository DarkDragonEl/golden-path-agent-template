# Phase C, Step C1b. SysR-P-F-06 -- promotion is exclusively a GitOps PR
# merge, never a rebuild and never a direct push to main. This Task only
# runs when every prior gate passed (the Pipeline's `when:` condition, not
# this Task's own logic) and only ever touches
# deploy/kustomize/base/kustomization.yaml's one images.digest field.
#
# Credential: docs/phase-c-runbook.md §3 -- a fine-grained GitHub PAT,
# scoped to Contents (read/write) + Pull requests (read/write) on this one
# repository only, stored as Secret golden-path-agent-github-token in
# golden-path-agent-ci, key `token`. Never a pipeline param, never in this
# Task's own args (only as an env var sourced from the Secret, which
# Tekton does not log), never echoed by any step below.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: open-promotion-pr
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  params:
    - name: image-ref
      type: string
      description: Full pushed image reference including digest.
    - name: commit-sha
      type: string
  workspaces:
    - name: source
  steps:
    - name: commit-and-push-branch
      image: docker.io/alpine/git:2.54.0
      workingDir: $(workspaces.source.path)
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: golden-path-agent-github-token
              key: token
      script: |
        #!/bin/sh
        set -eu
        BRANCH="promote/$(params.commit-sha)"
        sed -i "s#digest: sha256:.*#digest: $(echo "$(params.image-ref)" | sed 's/.*@//')#" \
          deploy/kustomize/base/kustomization.yaml
        git config user.name "golden-path-agent-ci"
        git config user.email "golden-path-agent-ci@users.noreply.github.com"
        git checkout -b "$BRANCH"
        git add deploy/kustomize/base/kustomization.yaml
        git commit -m "Promote $(params.commit-sha): $(params.image-ref)"
        git -c http.extraHeader="Authorization: Bearer ${GITHUB_TOKEN}" \
          push https://github.com/DarkDragonEl/golden-path-agent-template.git "$BRANCH"
        echo "$BRANCH" > $(workspaces.source.path)/.promotion-branch

    - name: open-pr
      image: docker.io/alpine/git:2.54.0
      workingDir: $(workspaces.source.path)
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: golden-path-agent-github-token
              key: token
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache curl python3 >/dev/null
        BRANCH=$(cat $(workspaces.source.path)/.promotion-branch)
        BODY=$(python3 -c "
        import json
        print(json.dumps({
            'title': 'Promote ' + '$(params.commit-sha)'[:12],
            'head': '$BRANCH',
            'base': 'main',
            'body': 'Automated digest promotion PR. Image: $(params.image-ref)\n\nOnly deploy/kustomize/base/kustomization.yaml\'s images.digest field changes. Merging this is the promotion event (SysR-P-F-06) -- demo-prod syncs from it via ArgoCD.',
        }))
        ")
        curl -sf -X POST \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -d "$BODY" \
          https://api.github.com/repos/DarkDragonEl/golden-path-agent-template/pulls
