# Phase C, Step C1b. SysR-P-F-06 -- promotion is exclusively a GitOps PR
# merge, never a rebuild and never a direct push to main. This Task only
# runs when every prior gate passed (the Pipeline's `when:` condition, not
# this Task's own logic) and only ever touches
# deploy/kustomize/base/kustomization.yaml's one images.digest field.
#
# Credential: docs/phase-c-runbook.md §3 -- a fine-grained GitHub PAT,
# scoped to Contents (read/write) + Pull requests (read/write) on this one
# repository only, stored as Secret golden-path-agent-github-token in
# golden-path-agent-ci, key `token`. Never a pipeline param, never in this
# Task's own args (only as an env var sourced from the Secret, which
# Tekton does not log), never echoed by any step below.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: open-promotion-pr
  namespace: golden-path-agent-ci
  labels:
    app.kubernetes.io/part-of: golden-path-agent
spec:
  params:
    - name: image-ref
      type: string
      description: Full pushed image reference including digest.
    - name: commit-sha
      type: string
    # DEC-098/DEC-099 (G2, three-image split): three independent
    # PipelineRuns can promote off the same commit-sha (each pipeline
    # fires on the same push). `image-name` scopes the digest edit to
    # exactly one of the three `images:` entries in
    # deploy/kustomize/base/kustomization.yaml -- a blind, unscoped sed
    # (this Task's original single-image behavior) would match and
    # corrupt all three digest lines at once now that there's more than
    # one. `component` disambiguates the promotion branch name so three
    # concurrent promotions off one commit never collide on
    # `promote/<sha>`.
    - name: image-name
      type: string
      description: "The kustomize images[].name key to update: golden-path-agent | golden-path-agent-mcp | golden-path-agent-approval"
    - name: component
      type: string
      description: "agent | mcp | approval -- used only to keep promotion branch names collision-free across the three independent pipelines."
  workspaces:
    - name: source
  steps:
    - name: commit-and-push-branch
      image: docker.io/alpine/git:2.54.0
      workingDir: $(workspaces.source.path)
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: golden-path-agent-github-token
              key: token
      script: |
        #!/bin/sh
        set -eu
        BRANCH="promote/$(params.component)/$(params.commit-sha)"
        NEW_DIGEST="digest: $(echo "$(params.image-ref)" | sed 's/.*@//')"
        # Range-scoped sed: only the digest line inside THIS image's own
        # `- name: $(params.image-name)` block is touched -- the other
        # two images' digest lines fall outside the /- name: .../,/digest:/
        # address range and are left untouched. Confirmed against the
        # real file shape: each images[] entry is exactly
        # `- name: ...` / `newName: ...` / `digest: ...`, three lines,
        # so the range closes on the very next `digest:` line, which is
        # this same entry's own.
        sed -i "/- name: $(params.image-name)$/,/digest: sha256:/{s#digest: sha256:.*#${NEW_DIGEST}#}" \
          deploy/kustomize/base/kustomization.yaml
        git config user.name "golden-path-agent-ci"
        git config user.email "golden-path-agent-ci@users.noreply.github.com"
        git checkout -b "$BRANCH"
        git add deploy/kustomize/base/kustomization.yaml
        git commit -m "Promote $(params.commit-sha): $(params.image-ref)"
        # DEC-037: GitHub's git-over-HTTPS smart endpoint does not accept
        # a bare `Authorization: Bearer` header for git push -- confirmed
        # live ("could not read Username for 'https://github.com'", git
        # falling back to an interactive credential prompt with no TTY
        # available). The URL-embedded-credential form below is GitHub's
        # own documented mechanism for PAT-based git push and is
        # recognized immediately, no credential helper needed. Still
        # never echoed -- only ever appears as a command argument, same
        # handling this Task's own header comment already commits to.
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/DarkDragonEl/golden-path-agent-template.git" "$BRANCH"
        echo "$BRANCH" > $(workspaces.source.path)/.promotion-branch

    - name: open-pr
      image: docker.io/alpine/git:2.54.0
      workingDir: $(workspaces.source.path)
      env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: golden-path-agent-github-token
              key: token
      script: |
        #!/bin/sh
        set -eu
        apk add --no-cache curl python3 >/dev/null
        BRANCH=$(cat $(workspaces.source.path)/.promotion-branch)
        BODY=$(python3 -c "
        import json
        print(json.dumps({
            'title': 'Promote $(params.component) ' + '$(params.commit-sha)'[:12],
            'head': '$BRANCH',
            'base': 'main',
            'body': 'Automated digest promotion PR for the $(params.component) component ($(params.image-name)). Image: $(params.image-ref)\n\nOnly the $(params.image-name) entry in deploy/kustomize/base/kustomization.yaml\'s images: list changes -- the other two components\' digests are untouched. Merging this is the promotion event (SysR-P-F-06) -- demo-prod syncs from it via ArgoCD.',
        }))
        ")
        curl -sf -X POST \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -d "$BODY" \
          https://api.github.com/repos/DarkDragonEl/golden-path-agent-template/pulls
