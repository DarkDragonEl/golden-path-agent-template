# Template for triggering ${{ values.name }}-ci (pipeline.yaml) --
# `generateName`, not `name`, since every real trigger creates a new
# PipelineRun. `taskRunTemplate.serviceAccountName` is the
# least-privilege identity from pipelines/bootstrap/rbac.yaml -- every
# Task step in this run executes as that ServiceAccount, nothing
# broader.
#
# This field lives under spec.taskRunTemplate in the tekton.dev/v1
# API this cluster runs (confirmed via `oc explain pipelinerun.spec` --
# there is no top-level spec.serviceAccountName at all). A first real run
# with the field misplaced at spec.serviceAccountName (an older/incorrect
# shape) was silently pruned by the API server rather than rejected --
# oc create --dry-run=server validated the object successfully because the
# unrecognized field was dropped, not because the run's actual identity
# was verified. Every TaskRun instead ran as the namespace's own default
# `pipeline` ServiceAccount (broader than intended within
# ${{ values.name }}-ci itself -- full CRUD on secrets/routes/templates/
# deploymentconfigs, confirmed via `oc auth can-i --list`). Lesson,
# generalized: schema-valid dry-run proves a manifest parses, not that
# every field you wrote is one the schema actually recognizes and the
# controller actually consumes -- verify a field's real location
# (`oc explain`) before trusting it, and after applying, read the live
# object's own spec back to confirm the value landed where intended, not
# just that `oc apply`/`create` reported success.
#
# The `source` workspace is backed by a fresh PVC per run (not an
# emptyDir): Tekton workspaces only share storage across every Task pod in
# one PipelineRun when backed by real persistent storage, which
# fetch-source's checkout being visible to every later Task depends on.
#
# C1c fires this for the first real green-path run:
#   oc create -f pipelines/pipelinerun-template.yaml -n ${{ values.name }}-ci
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ${{ values.name }}-ci-
  namespace: ${{ values.name }}-ci
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
spec:
  pipelineRef:
    name: ${{ values.name }}-ci
  taskRunTemplate:
    serviceAccountName: ${{ values.name }}-ci-pipeline
  params:
    - name: revision
      value: main
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
