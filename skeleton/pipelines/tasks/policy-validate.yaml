# SysR-P-F-11 -- the CI pipeline validates policy bundles and the
# config contract. Three checks, deliberately kept separate steps where
# opa and python don't share one container image:
#   1. opa test policy/opa/ -- the policy-definition unit tests themselves
#      (proves the rego's own internal logic, including the fail-closed
#      deny path, is correct).
#   2. tools/check_policy_sync.py -- proves policy/approval_rules.yaml (the
#      actual runtime source of truth) and policy/opa/approval_policy.rego
#      (the hand-maintained mirror) have not drifted apart. The rego
#      mirror's "kept in sync by hand" discipline needs to be an
#      enforced invariant, not just a documented hope.
#   3. tools/check_config_contract.py -- catches a deployment surface
#      silently missing a required key, or a GitOps-synced environment
#      consuming an unresolved placeholder value, turned into an
#      enforced invariant the same way check 2 already does for the
#      policy/rego drift class.
# None of the three is a live enforcement point -- agent/policy.py stays
# the sole Policy Decision Point at request time (see
# approval_policy.rego's own header).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: policy-validate
  namespace: ${{ values.name }}-ci
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
spec:
  workspaces:
    - name: source
  steps:
    - name: opa-test
      image: docker.io/openpolicyagent/opa:1.19.1
      workingDir: $(workspaces.source.path)
      command: ["opa"]
      args: ["test", "policy/opa/", "-v"]

    - name: opa-dump-rego-data
      # -debug variant specifically: the plain 1.19.1 image has no shell at
      # all (verified live -- "sh: not found"), which script: requires.
      # -debug is the same OPA binary with a busybox shell added for
      # exactly this kind of use.
      image: docker.io/openpolicyagent/opa:1.19.1-debug
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        opa eval -d policy/opa -f json 'data.golden_path.approval.tool_classification' \
          > /tmp/tool_classification.json
        opa eval -d policy/opa -f json 'data.golden_path.approval.default_classification' \
          > /tmp/default_classification.json
        cp /tmp/tool_classification.json /tmp/default_classification.json $(workspaces.source.path)/

    - name: policy-sync-check
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        # pip install needs a writable $HOME under this project's
        # restricted-v2-SCC identity -- see unit-tests.yaml's fuller note.
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q pyyaml
        python tools/check_policy_sync.py \
          --rego-classification-file tool_classification.json \
          --rego-default-file default_classification.json
        rm -f tool_classification.json default_classification.json

    - name: config-contract-check
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q pyyaml
        python tools/check_config_contract.py
