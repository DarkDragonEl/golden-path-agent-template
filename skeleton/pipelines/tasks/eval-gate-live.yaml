# SysR-P-F-05(2) agent tests.
#
# Design note, stated explicitly rather than glossed over: eval/domain_executor.py
# drives agent.graph.build_graph() fully in-process (its own docstring:
# "no container/HTTP needed") -- it was built for local, in-process
# testing, not to exercise an already-deployed, separately-running HTTP
# service. Building a new HTTP-based eval executor to literally test the
# deployed agent pod's /invoke surface here would be real scope beyond
# what this stage needs: this Task re-runs the existing, unmodified
# eval.cli --domain harness with AGENT_MODEL_MODE=live (the real MaaS,
# the exact temperature=0/seed=42 contract) and MCP_MODE=mock (same
# in-process mock ITSM local testing always used) -- testing real
# reasoning quality against the real model, which the deployed pods don't change.
# security-tests and operational-tests (separate Tasks) are what actually
# exercise the deployed pods' live HTTP surface.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eval-gate-live
  namespace: ${{ values.name }}-ci
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
spec:
  workspaces:
    - name: source
  steps:
    - name: eval-domain
      image: docker.io/library/python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: AGENT_MODEL_MODE
          value: live
        - name: MCP_MODE
          value: mock
        - name: MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: ${{ values.name }}-secrets
              key: MODEL_API_KEY
        - name: MODEL_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: ${{ values.name }}-ci-config
              key: MODEL_API_BASE_URL
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: ${{ values.name }}-ci-config
              key: MODEL_NAME
        # pip install needs a writable $HOME under this project's
        # restricted-v2-SCC identity -- see unit-tests.yaml's fuller note.
        - name: HOME
          value: /tmp
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -q -r requirements.txt -r requirements-dev.txt
        # An unexpected failure here on a PR that doesn't touch the
        # measurement instrument is not automatically the change's
        # fault -- see docs/phase-c-runbook.md §4 before treating a red
        # gate as a regression. Model-identity capture (runbook §5/6) is
        # NOT implemented yet -- not silently assumed present here.
        python -m eval.cli run --domain
