# This Subscription provisions openshift-pipelines-operator-rh from
# scratch, for a cluster where it is not already installed cluster-wide
# (docs/environments.md's own "shared, multi-tenant lab" note covers the
# case where a prior, unrelated install already provides it).
#
# Structurally different from keycloak-operator.yaml's pattern:
# openshift-pipelines-operator-rh only supports AllNamespaces install mode
# (PINS.md, verified live via packagemanifest), so this goes into
# openshift-operators, the cluster's own pre-existing AllNamespaces
# OperatorGroup (global-operators) -- no new OperatorGroup object needed
# or created here. This is a cluster-scoped action (like namespaces.yaml),
# applied manually by a human with cluster-admin-adjacent access, never
# by the CI pipeline's own ServiceAccount.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-pipelines-operator-rh
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
spec:
  channel: pipelines-1.22
  name: openshift-pipelines-operator-rh
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
  startingCSV: openshift-pipelines-operator-rh.v1.22.5
