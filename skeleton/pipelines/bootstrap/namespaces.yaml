# Applied once, by a human, as a deliberate bootstrap step -- not by
# the pipeline itself, and not by ArgoCD either (demo-prod's own
# Application deliberately sets CreateNamespace=false, same reasoning
# as pilot-prod's existing stub -- see deploy/argocd/apps/demo-prod.yaml).
# All three namespaces are pre-created here, not created/destroyed per
# PipelineRun or per sync, specifically because the pipeline's own
# ServiceAccount (rbac.yaml, this directory) is granted NO
# cluster-scoped permissions at all (no ClusterRoleBinding, no
# cluster-admin) -- and creating/deleting a Namespace object is an inherently
# cluster-scoped action that a namespace-scoped Role/RoleBinding cannot
# grant (Kubernetes RBAC's `create` verb also does not support
# `resourceNames` restriction, since the object doesn't exist yet at
# authorization-check time -- there is no narrower grant available for
# "create only this one namespace"). The "ephemeral" property of
# ephemeral-test is preserved at the resource level instead: the pipeline's
# deploy-ephemeral/destroy-ephemeral stages create and delete the
# Deployments/Services/ConfigMaps inside this standing namespace on every
# run, never the namespace itself.
apiVersion: v1
kind: Namespace
metadata:
  name: ${{ values.name }}-ci
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${{ values.name }}-ephemeral-test
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${{ values.name }}-demo-prod
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
    # OpenShift GitOps's default ClusterRole for the ArgoCD application
    # controller only grants get/list/watch on core resources
    # cluster-wide -- write access to a target namespace requires
    # opting it in via this label, which triggers the GitOps operator's
    # own controller to create a namespace-scoped RoleBinding
    # automatically.
    # ${{ values.name }}-ephemeral-test deliberately does NOT get this
    # label -- it is pipeline-managed (direct oc apply), never
    # ArgoCD-synced, per docs/environments.md's ownership model.
    argocd.argoproj.io/managed-by: openshift-gitops
---
# A fifth, separate namespace for Keycloak + its own Postgres -- not
# folded into ${{ values.name }}-demo-prod or any existing namespace.
# rhbk-operator's only supported install modes are
# OwnNamespace/SingleNamespace (PINS.md, verified live) -- it needs one
# namespace it owns outright, and Keycloak itself is platform identity
# infrastructure, not part of this project's own promoted
# image/environments (deploy/kustomize/), so it does not belong inside
# any of those three. Same manual, human-applied bootstrap discipline
# as the three namespaces above, since creating a Namespace is itself a
# cluster-scoped action no namespace-scoped Role can grant (see this
# file's own header comment).
apiVersion: v1
kind: Namespace
metadata:
  name: ${{ values.name }}-keycloak
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
---
# A sixth namespace for the cluster-tier OTel Collector -- platform
# observability infrastructure, not part of this project's own
# promoted image/environments, same reasoning as
# ${{ values.name }}-keycloak's own separate namespace above.
# Reachable cross-namespace from ephemeral-test/demo-prod/${{ values.name }}-keycloak
# (no NetworkPolicy restricts egress from any of those pods today, and
# none is added restricting ingress here either -- mirrors Keycloak's own
# precedent of no NetworkPolicy, both being shared platform infra reachable
# from anywhere in this project's own namespaces, a deliberate choice,
# not an oversight).
apiVersion: v1
kind: Namespace
metadata:
  name: ${{ values.name }}-otel
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
