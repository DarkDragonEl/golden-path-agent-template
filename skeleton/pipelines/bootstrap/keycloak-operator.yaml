# Phase D, D2 entry gate (DECISIONS.md DEC-053). The one flagged
# cluster-scoped step in the whole Phase D plan: CRD registration
# (keycloaks.k8s.keycloak.org, keycloakrealmimports.k8s.keycloak.org) is
# structurally cluster-scoped for any operator install, unavoidable
# regardless of which Keycloak realization was picked (PINS.md's own
# research note). The OperatorGroup/Subscription objects themselves are
# namespace-scoped to ${{ values.name }}-keycloak (no AllNamespaces --
# rhbk-operator does not support it, per PINS.md); OLM's own CSV would
# additionally have created a cluster-scoped ClusterRole/ClusterRoleBinding
# for the operator's own runtime permissions (not inspected at the time
# this comment was first written -- corrected here for honesty: DEC-056
# found the functionally-equivalent upstream manifests DO carry exactly
# one such ClusterRoleBinding, read-only `config.openshift.io/ingresses`
# access, which OLM's CSV almost certainly needs too).
#
# BLOCKED LIVE (DECISIONS.md DEC-055/DEC-056), NOT applied to the
# cluster: a different tenant's broken CatalogSource
# (nousie-docling-catalog) poisons OLM's cluster-wide package resolution
# for every Subscription on this shared cluster, confirmed via
# catalog-operator's own logs and matching Red Hat KB 7052456 exactly.
# Not this project's resource to fix. D2 actually proceeded via
# pipelines/bootstrap/keycloak-operator-upstream/ (the Keycloak project's
# own OLM-free kustomize install, pinned to tag 26.7.2) instead -- kept
# here, committed, deliberately NOT deleted from Git, as documented tech
# debt: migrate to rhbk-operator via this file once the shared cluster's
# catalog is healthy. The CRD group (k8s.keycloak.org) is identical
# either way, so that migration only swaps the operator, never the
# Keycloak/KeycloakRealmImport CRs built against it.
#
# Applied manually, by a human with cluster-admin-adjacent access, same
# category as pipelines/bootstrap/namespaces.yaml/rbac.yaml -- never by
# the CI pipeline's own ServiceAccount (which has zero cluster-scoped
# grants, deliberately).
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: ${{ values.name }}-keycloak
  namespace: ${{ values.name }}-keycloak
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
spec:
  targetNamespaces:
    - ${{ values.name }}-keycloak
---
# PINS.md: rhbk-operator, channel stable-v26.6, CSV
# rhbk-operator.v26.6.6-opr.1, catalog redhat-operators -- re-verified
# live 2026-08-22, byte-identical to the Phase D plan's original
# research. installPlanApproval: Manual + startingCSV pinned to this
# exact CSV, deliberately not OLM's default auto-upgrade behavior --
# this project's own "pin exact versions" discipline (CLAUDE.md's "Reuse
# over building" rule), applied to an operator subscription the same way
# it has been applied to every other pinned component in PINS.md.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: ${{ values.name }}-keycloak
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
spec:
  channel: stable-v26.6
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
  startingCSV: rhbk-operator.v26.6.6-opr.1
