# Auto-sync is deliberately ON here (unlike pilot-prod's existing stub) --
# the digest-promotion PR merge is this environment's own human gate:
# once merged, ArgoCD picks up the promoted digest with no further manual
# apply step -- that is the whole point of the GitOps promotion model
# this demonstrates.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}-demo-prod
  namespace: openshift-gitops
spec:
  project: ${{ values.name }}
  source:
    repoURL: https://${{ values.gitHost }}/${{ values.repoOwner }}/${{ values.repoName }}-gitops.git
    targetRevision: main
    path: kustomize/overlays/demo-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.name }}-demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # namespace is bootstrapped once, out-of-band
        # (pipelines/bootstrap/namespaces.yaml) -- same reasoning as
        # pilot-prod's existing stub, not ArgoCD-managed.
