# Local-dev OTel Collector config. Minimal by design, matching this
# milestone's scope (CLAUDE.md scope guard): an OTLP HTTP receiver and a
# debug exporter that writes received spans to this container's own
# stdout (`podman logs golden-path-otel-collector-dev`). No
# trace-visualization UI here; the cluster observability stack is a
# separate, later concern (see PINS.md).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
