apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${{ values.name }}-demo-prod

# Namespace is bootstrapped once, out-of-band (pipelines/bootstrap/namespaces.yaml)
# -- see namespace.yaml in this directory (documentation only, not a
# managed resource here) for why.
resources:
  - ../../base

configMapGenerator:
  - name: ${{ values.name }}-config
    behavior: merge
    literals:
      - MCP_MODE=live # the mock ITSM *data* stays synthetic regardless of
        # this value (itsm_search_records/itsm_create_request never
        # branch on MCP_MODE at all, CLAUDE.md's synthetic-data-only rule
        # is unaffected either way). What this flips is whether the agent
        # calls MCP in-process (mock) or over real HTTP to the
        # separately-deployed mcp pod (live) -- required for
        # MCP_AUTH_MODE=oidc below to mean anything: enforcement on a
        # call that never leaves the process isn't enforcement.
      - AGENT_OIDC_MODE=oidc
      - MCP_AUTH_MODE=oidc
      - APPROVAL_MODE=required
      - DATA_SOURCE_BINDING=synthetic # CLAUDE.md: synthetic corpus only,
        # never real client/organization data, in any promoted environment.
      # ephemeral-test's real values are injected transiently at apply-time
      # by the pipeline's own deploy-ephemeral Task (a one-shot `oc apply`,
      # never reconciled again). demo-prod has no such injection point --
      # it is synced by ArgoCD with syncPolicy.automated.selfHeal: true,
      # which would continuously stomp any manually-applied override of a
      # Kustomize-managed ConfigMap key straight back to whatever is
      # committed here. Since the real endpoint can never be committed to
      # this public repo (base/configmap.yaml's own placeholder is the
      # committed value), these four keys are instead provisioned via a
      # THIRD copy of the ${{ values.name }}-secrets Secret, in this
      # namespace, alongside MODEL_API_KEY -- a Secret is never
      # Kustomize/ArgoCD-managed (same established reasoning as
      # base/kustomization.yaml's own comment on why externalsecret.yaml
      # was dropped rather than replaced with a stub Secret). Kubernetes'
      # own envFrom ordering (deployment-agent.yaml lists secretRef AFTER
      # configMapRef) means the Secret's real values correctly shadow
      # this ConfigMap's inherited base placeholders at the container
      # level -- no code or manifest mechanism needed beyond that
      # ordering, which already exists. Every required key IS declared
      # (by base/configmap.yaml), and this comment states exactly where
      # each demo-prod-specific real value actually comes from, so it is
      # never silent.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://${{ values.name }}-otel-collector.${{ values.name }}-otel.svc.cluster.local:4318 # the
        # cluster-tier collector.
        # No approval-config ConfigMap generator here: the approval
        # service is a shared Platform Foundation singleton, never
        # bundled or co-deployed by this template (approvalServiceEndpoint
        # config only) -- this overlay's base has no approval-config
        # resource for a `behavior: merge` generator to merge into.

replicas:
  - name: ${{ values.name }}
    count: 1
