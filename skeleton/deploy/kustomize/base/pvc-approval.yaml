# SRS-APR-DATA-01 (restart survival) -- SQLite on a PVC, per the Phase D
# plan's D1 persistence decision (reuses the already-solved
# restricted-v2/arbitrary-non-root-UID fights this image's own
# Containerfile already fixed, DEC-026-034 -- a Postgres route would be a
# new instance of that same class of fight). New resource kind for this
# project; RWO, small -- demo-scale, one proposal in flight at a time.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ values.name }}-approval-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
