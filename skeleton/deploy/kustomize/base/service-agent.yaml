apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}
  labels:
    backstage.io/kubernetes-id: ${{ values.name }} # DEC-141: Topology resolves
    # Route -> Service -> workload, so the Service must be selected too.
spec:
  selector:
    app.kubernetes.io/name: ${{ values.name }}
    app.kubernetes.io/component: agent
  ports:
    - name: http
      port: 8080
      targetPort: http
