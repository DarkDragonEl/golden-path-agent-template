# The workload-identity anchor for the agent's own identity requirements
# -- deploy/kustomize/base/serviceaccount-mcp.yaml is the mcp role's own,
# separate ServiceAccount (Phase D2, DECISIONS.md DEC-061: the DEC-045
# finding that agent/mcp shared one identity is fixed here).
#
# DEFERRED: SA-token OIDC federation (a K8s ServiceAccount token
# exchanged directly against Keycloak, no stored client secret) is the
# phase-two integration point -- client-credentials (client_id+secret in
# a K8s Secret, agent/oidc_client.py) was chosen for this demo milestone
# instead, per DEC-061: real, unbudgeted extra complexity for this
# scope, not a stale intention left here by accident.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.name }}
  annotations: {}
