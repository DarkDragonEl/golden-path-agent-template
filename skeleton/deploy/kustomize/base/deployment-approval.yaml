# Same immutable image, a third entrypoint.sh role ("approval") -- Phase
# C's whole build-once/promote-unchanged pipeline covers this component
# for free: no new Tekton pipeline, no new ImageStream, no new
# digest-promotion step. The literal reading of CLAUDE.md's "one
# immutable artifact" rule, applied consistently, not special-cased.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}-approval
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.name }}
      app.kubernetes.io/component: approval
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.name }}
        app.kubernetes.io/component: approval
    spec:
      serviceAccountName: ${{ values.name }}-approval
      containers:
        - name: approval
          image: ${{ values.name }}
          args: ["approval"]
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: ${{ values.name }}-approval-config
            - secretRef:
                name: ${{ values.name }}-approval-secrets
                optional: true   # AUTH_MODE=none (D1) needs no secret at all;
                # required once D2 flips AUTH_MODE=oidc (an OIDC client
                # secret) or if Postgres is chosen over SQLite (a DB
                # credential) -- optional: true keeps D1 deployable on its
                # own, per the plan's explicit "D1 independent of D2" goal.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /opt/app-root/src/state/approval
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: ${{ values.name }}-approval-state
