# A distinct ServiceAccount from ${{ values.name }} -- Phase D, DEC-045
# finding: `agent` and `mcp` currently share one ServiceAccount
# (serviceaccount.yaml), so "ServiceAccount-per-workload" wasn't actually
# true yet even for the two existing roles. D1 does not perpetuate that
# for approval-service; D2 (DEC-061) closes the same gap for agent/mcp
# too -- serviceaccount-mcp.yaml.
#
# DEFERRED: SA-token OIDC federation is the phase-two integration point;
# client-credentials (approval_service/auth.py validating a bearer token
# the agent obtains via agent/oidc_client.py) was chosen for this demo
# milestone instead, per DEC-061 -- same reasoning as
# serviceaccount.yaml's own note.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ values.name }}-approval
  annotations: {}
