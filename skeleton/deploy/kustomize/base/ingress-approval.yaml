# Generic Ingress, mirrors ingress.yaml's own "deliberately not a Route"
# reasoning. Needed for D3's approver-facing surface to reach the
# decision/query endpoints directly (the plan's recommended
# direct-to-service design, not proxied through the agent).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ values.name }}-approval
  annotations: {}   # TODO(platform): ingress-class/TLS annotations are platform-specific — add per environment overlay
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ values.name }}-approval
                port:
                  name: http
