# eval/corpus-manifest.yaml
#
# Identity-only manifest for Phase A (Delivery Step 1). Fixes doc_id, title,
# and metadata for the ~20 synthetic corpus documents the knowledge_qa cases
# assume, so case<->document references are stable before any document
# content exists. Document CONTENT (chunking, embedding, actual body text)
# is Phase B (corpus/ingest.py + corpus/seed/) — see TODO_DOMAIN.md.
#
# All documents, roles, and figures below are synthetic (CLAUDE.md: no real
# product names, hostnames, or figures from any real company). classification
# uses a plain three-tier scheme: internal-public, internal-restricted,
# internal-confidential.
#
# Field set is the union of this mission's required list (title, owner_role,
# classification, version, effective_date, access_policy, refresh_process)
# and corpus/README.md's existing six-field commitment (adds `source`),
# plus `doc_id` as the lookup key knowledge_qa cases cite in
# expected.source_doc_ids.

