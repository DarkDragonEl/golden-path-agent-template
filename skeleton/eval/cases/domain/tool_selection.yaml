# Checkpoint 1 exemplars (3 of ~8 target). Deliberately one exemplar per
# possible correct_tool value (search / create / none) for maximum coverage
# from the smallest possible set.

- id: TSEL-001
  category: tool_selection
  input:
    query: "Has anyone already reported that CI runner cache issue?"
  expected:
    correct_tool: itsm_search_records
    distractor_tools_not_called: ["itsm_create_request"]
    rationale_note: "Asking whether something has already been reported is a search, not a new request"
  threshold_notes: "counts toward tool_selection gate"
  tags: ["tool_selection", "read-only"]
  version: "0.1.0"

- id: TSEL-002
  category: tool_selection
  input:
    query: "I need my team's namespace quota increased for next sprint."
  expected:
    correct_tool: itsm_create_request
    distractor_tools_not_called: ["itsm_search_records"]
    rationale_note: "This is an actionable ask for a new provisioning change, not an information lookup — correct dispatch still routes to the approval-gated draft flow (see draft_request.yaml), which this case does not itself test"
  threshold_notes: "counts toward tool_selection gate"
  tags: ["tool_selection", "write"]
  version: "0.1.0"

- id: TSEL-003
  category: tool_selection
  input:
    query: "What's the difference between an incident and a known error in our ITSM process?"
  expected:
    correct_tool: none
    distractor_tools_not_called: ["itsm_search_records", "itsm_create_request"]
    rationale_note: "Conceptual/definitional question answerable from the knowledge corpus alone; no live record lookup needed"
  threshold_notes: "counts toward tool_selection gate"
  tags: ["tool_selection", "read-only"]
  version: "0.1.0"

# R2 remedy (DEC-018, TSEL-004 redesign): the original query ("has this
# ingress certificate issue come up before") named a topic (KI-003,
# "Ingress Certificate Renewal Race Condition") that the synthetic corpus
# also happens to document -- decide could (and, per DEC-017's final
# triage, reliably did) answer directly from grounded knowledge instead of
# exercising the tool-selection decision this case exists to isolate.
# Redesigned to a topic with no corpus overlap (verified against every
# doc_id in eval/corpus-manifest.yaml) so a search decision is the only
# path to a real answer -- but the redesign refined, not closed, the
# diagnosis: decide still treats "has anyone reported X before" as a
# knowledge question even with zero corpus overlap, correctly declining
# to fabricate ("No, there is no information...") rather than searching.
# The root cause is a classification tendency for this phrasing, not
# merely a corpus-content artifact -- known-gap since 2026-08-21
# (DECISIONS.md DEC-018), excluded from the tool_selection gate count.
- id: TSEL-004
  category: tool_selection
  input:
    query: "Before I file anything, has anyone reported DNS resolution timeouts for internal service endpoints?"
  expected:
    correct_tool: itsm_search_records
    distractor_tools_not_called: ["itsm_create_request"]
    rationale_note: "Checking whether something has already occurred is a search, even though the user is anticipating a possible future request"
  threshold_notes: "known-gap: excluded from the tool_selection gate count since 2026-08-21 (DECISIONS.md DEC-018) -- decide treats this phrasing as a knowledge question regardless of corpus overlap; it correctly declines to fabricate rather than hallucinating a search result, so no unsafe behavior occurs, just the wrong tool-vs-no-tool decision"
  tags: ["tool_selection", "read-only", "known-gap"]
  version: "0.3.0"

- id: TSEL-005
  category: tool_selection
  input:
    query: "I want to request more information about how to onboard a new namespace — please log this as a formal information request."
  expected:
    correct_tool: itsm_create_request
    distractor_tools_not_called: ["itsm_search_records"]
    rationale_note: "The user explicitly asks to log a formal record (category: information), not just receive a conversational answer"
  threshold_notes: "counts toward tool_selection gate"
  tags: ["tool_selection", "write"]
  version: "0.1.0"

